<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>解压小铺</title>
<style>
  :root{--bg:#141018;--card:#241d2c;--fg:#f5efe6;--muted:#b4a8bf;--accent:#ff5d5d;--gold:#ffc94d}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,"PingFang HK","PingFang SC","Microsoft JhengHei","Microsoft YaHei",sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
  .screen{position:fixed;inset:0;display:none;flex-direction:column}
  .screen.on{display:flex}
  #home{overflow-y:auto;padding:22px 16px 40px;align-items:center}
  h1{margin:6px 0 4px;font-size:34px;letter-spacing:2px}
  .sub{color:var(--muted);margin:0 0 16px;text-align:center;line-height:1.5}
  .row{display:flex;gap:8px;justify-content:center;margin:6px 0 14px;flex-wrap:wrap}
  .pill{background:#ffffff12;color:var(--fg);border:1px solid #ffffff30;border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer}
  .pill.sel{background:var(--gold);color:#222;border-color:var(--gold)}
  .cards{display:grid;gap:14px;width:100%;max-width:520px}
  .card{background:linear-gradient(135deg,#33263f,#211a28);border-radius:20px;padding:20px;cursor:pointer;display:flex;gap:16px;align-items:center;transition:transform .1s;border:1px solid #ffffff14}
  .card:active{transform:scale(.97)}
  .card .ico{font-size:52px;filter:drop-shadow(0 6px 10px #0008)}
  .card b{font-size:21px;display:block}
  .card span{color:var(--muted);font-size:13px;display:block;margin-top:4px}
  .card .price{color:var(--gold);font-weight:800;font-size:15px;margin-top:8px}
  .lbl{font-size:12px;color:var(--muted)}
  .btn{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:11px 20px;font-size:16px;font-weight:700;cursor:pointer}
  .btn.ghost{background:#ffffff1c}
  .btn.gold{background:var(--gold);color:#222}
  .small{font-size:12px;color:var(--muted);text-align:center}
  #game header{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#000a;z-index:3}
  #game header .t{flex:1;font-weight:700;font-size:17px}
  #game header .score{color:var(--gold);font-weight:700;font-size:14px;text-align:right}
  #stage{flex:1;position:relative;overflow:hidden}
  #stage canvas{display:block;width:100%;height:100%;touch-action:none}
  #tools{display:flex;gap:8px;padding:10px 12px;background:#000a;align-items:center;flex-wrap:wrap;z-index:3}
  #tools:empty{display:none}
  #tools input{flex:1;min-width:0;padding:10px;border-radius:10px;border:0;font-size:16px}
  .chip{background:#ffffff18;border:1px solid #ffffff33;color:#fff;border-radius:999px;padding:7px 12px;font-size:13px;cursor:pointer}
  #bubble{position:absolute;left:0;top:0;transform:translate(-50%,-100%);background:#fff;color:#222;border-radius:16px;padding:10px 14px;max-width:min(78vw,320px);font-size:16px;font-weight:700;line-height:1.4;box-shadow:0 8px 24px #0008;pointer-events:none;display:none;z-index:2}
  #bubble::after{content:"";position:absolute;left:50%;bottom:-9px;margin-left:-9px;border:9px solid transparent;border-bottom:0;border-top-color:#fff}
  #bubble small{display:block;font-weight:400;color:#777;font-size:13px;margin-top:4px}
  #hint{position:absolute;left:0;right:0;bottom:14px;text-align:center;color:#fffc;font-size:15px;pointer-events:none;text-shadow:0 2px 6px #000;padding:0 16px}
  #center{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;z-index:2;background:#0007;text-align:center;padding:16px}
  #center.on{display:flex}
  #center h2{margin:0;font-size:26px}
  #luck{position:absolute;left:10px;bottom:38px;background:#000b;border:1px solid #ff3b3b55;border-radius:12px;padding:8px 10px;font-size:12px;display:none;z-index:2;min-width:150px;pointer-events:none}
  #luck b{color:#ff6b6b;font-size:13px}
  #luck .r{display:flex;align-items:center;gap:6px;margin-top:4px}
  #luck .r span{width:52px;color:#ddd}
  #luck .bar{flex:1;height:7px;background:#ffffff22;border-radius:4px;overflow:hidden}
  #luck .bar i{display:block;height:100%;background:linear-gradient(90deg,#7b2ff7,#ff3b3b);transition:width .2s}
  #luck .x{color:#ffb3b3;margin-top:5px}
  .chant{width:100%;text-align:center;background:#3a0d12;border:1px solid #ff3b3b55;border-radius:12px;padding:8px}
  .chant .zh{font-size:16px;font-weight:800;color:#ffd7d7}
  .chant .py{font-size:13px;color:var(--gold)}
  #lung{position:absolute;left:50%;bottom:44px;width:min(60vw,260px);height:12px;margin-left:calc(min(60vw,260px)/-2);background:#0008;border-radius:6px;overflow:hidden;display:none}
  #lung i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb36b,#ff4d2e);border-radius:6px}
  .ft{position:absolute;transform:translate(-50%,-50%);font-weight:900;pointer-events:none;text-shadow:0 3px 8px #000;animation:ft 1.1s ease-out forwards;white-space:nowrap;z-index:2}
  @keyframes ft{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-70px}}
  .phrase{width:100%;text-align:center;background:#ffffff14;border-radius:14px;padding:10px 8px}
  .phrase .zh{font-size:24px;font-weight:800;margin-top:2px}
  .phrase .py{font-size:16px;color:var(--gold);margin-top:3px;letter-spacing:.5px}
  .mic{width:100%;padding:14px;font-size:18px}
  .mic.rec{background:#e11d48;animation:pulse 1s infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 8px #e11d4844}}
  .heard{width:100%;text-align:center;font-size:13px;color:var(--muted);min-height:18px}
  .modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
  .modal.on{display:flex}
  .modal .box{background:#fff;color:#222;border-radius:18px;padding:22px;max-width:360px;width:100%;text-align:center}
  .modal .box h3{margin:8px 0 4px}
  .modal .box p{color:#555;font-size:14px}
  .tag{display:inline-block;background:#ffe9a8;color:#7a5600;border-radius:6px;padding:2px 8px;font-size:12px}
</style>
</head>
<body>

  <div class="lbl" data-i="langLbl"></div>

    <button class="pill sel" data-l="zh">中文</button>

    <button class="pill" data-c="HKD">HK$ 港币</button>

  <div class="cards">
    <div class="card" data-g="villain"><div class="ico">🩴</div><div><b data-i="vName"></b><span data-i="vDesc"></span><div class="price"><span class="p"></span> <span data-i="vUnit" style="display:inline;color:inherit"></span></div></div></div>
    <div class="card" data-g="smoke"><div class="ico">🚬</div><div><b data-i="sName"></b><span data-i="sDesc"></span><div class="price"><span class="p"></span> <span data-i="sUnit" style="display:inline;color:inherit"></span></div></div></div>
  </div>
  <p class="small" style="margin-top:22px" data-i="foot"></p>
</section>

<section id="game" class="screen">
  <header>
    <button class="btn ghost" id="backBtn" style="padding:6px 12px;font-size:15px" data-i="back"></button>
    <div class="t" id="gTitle"></div>
    <div class="score" id="gScore"></div>
  </header>
  <div id="stage">
    <div id="bubble"></div>
    <div id="hint"></div>
    <div id="lung"><i></i></div>
    <div id="luck"></div>
    <div id="center"></div>
  </div>
  <div id="tools"></div>
</section>

<div class="modal" id="payModal">
  <div class="box">
    <span class="tag" data-i="demo"></span>
    <h3 id="payWhat"></h3>
    <div style="font-size:30px;font-weight:800;margin:6px 0" id="payAmt"></div>

    <button class="btn" id="confirmPay" style="width:100%" data-i="payOk"></button>
    <button class="btn" id="cancelPay" style="width:100%;margin-top:8px;color:#555;background:#eee" data-i="cancel"></button>
  </div>
</div>

<script src="vendor/three.min.js"></script>
<script>

  },

    foot:'Everything here is a virtual game. Do not use it to harm or harass real people. Virtual cigarettes, zero nicotine — real smoking harms your health.',
    back:'← Back', demo:'DEMO', demoTxt:'This is a demo of the checkout. The live version would connect to a real payment provider (Stripe / Touch \'n Go / FPX / PayMe...).',

    vReadThis:'Read this out loud:', vMic:'🎤 Tap to start speaking', vMicStop:'⏹ Tap when done', vHeard:'Granny heard: ', vAcc:'accuracy', vMicDenied:'Microphone blocked — please allow it in your browser settings.', vNoSR:'This browser has no speech recognition — type to the master in Chinese:', mand:'Mandarin', cant:'Cantonese', vTries:'Tries left:', vSayName:'Say the name of who you want to hit', vNameEg:'(in Chinese, e.g. 衰老板 — bad boss)', vOverT:'Granny: "No understand. Closed!"', vOverD:'Granny couldn\'t understand a word you said and shooed you away.', vRetry:'🙏 Beg granny again', vFinish:'😮‍💨 I feel better, done', vLuckT:'\'s fortune', vBottom:'💀 Out of luck!', vChantT:'👄 Chant while you hit:', vChantOr:'or shout "{n}" or curse them out!', vChantBtn:'🎤 Chant / curse', vChantStop:'🔴 Listening… (tap to stop)', vNameCrit:'🎯 Said the name! CRITICAL!', vChantOK:'📿 Chant works! Combo!', vCurseIn:'Type a curse / chant…',
  }
};
let lang = 'zh', currency = 'MYR';
const PRICES = { MYR:'RM 0.50', HKD:'HK$ 1.00', USD:'US$ 0.10' };
const t = k => I18N[lang][k];
const $ = s => document.querySelector(s);
function applyI18n(){
  document.querySelectorAll('[data-i]').forEach(el => el.innerHTML = t(el.dataset.i));
  document.querySelectorAll('.card .p').forEach(el => el.textContent = PRICES[currency]);
  document.documentElement.lang = lang === 'zh' ? 'zh' : 'en';
}
function pickPill(sel, attr, val){ document.querySelectorAll(sel+' .pill').forEach(b => b.classList.toggle('sel', b.dataset[attr]===val)); }
$('#langSel').onclick = e => { const l = e.target.dataset.l; if(!l) return; lang = l; pickPill('#langSel','l',l); applyI18n(); };
$('#curSel').onclick = e => { const c = e.target.dataset.c; if(!c) return; currency = c; pickPill('#curSel','c',c); applyI18n(); };

/* ---------- 付款（演示） ---------- */
let payCb = null;
function pay(what, cb){ payCb = cb; $('#payWhat').textContent = what; $('#payAmt').textContent = PRICES[currency]; $('#payModal').classList.add('on'); }
$('#confirmPay').onclick = () => { $('#payModal').classList.remove('on'); sfx.coin(); const cb = payCb; payCb = null; cb && cb(true); };
$('#cancelPay').onclick = () => { $('#payModal').classList.remove('on'); const cb = payCb; payCb = null; cb && cb(false); };

/* =========================================================
   声音（全部用代码合成）
   ========================================================= */
let AC;
function ac(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC && AC.state==='suspended') AC.resume(); return AC; }
function noise(dur, {freq=1000, q=1, vol=.5, type='bandpass', curve=2}={}){
  const a = ac(); if(!a) return;
  const len = Math.max(1, Math.floor(a.sampleRate*dur)), buf = a.createBuffer(1,len,a.sampleRate), d = buf.getChannelData(0);
  for(let i=0;i<len;i++){ const k=i/len; d[i] = (Math.random()*2-1) * (curve<0 ? Math.sin(k*Math.PI) : Math.pow(1-k, curve)); }
  const src = a.createBufferSource(); src.buffer = buf;
  const f = a.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  const g = a.createGain(); g.gain.value = vol;
  src.connect(f).connect(g).connect(a.destination); src.start();
}
function tone(f1, f2, dur, vol=.3, type='sine'){
  const a = ac(); if(!a) return;
  const o = a.createOscillator(), g = a.createGain(); o.type = type;
  o.frequency.setValueAtTime(f1, a.currentTime); o.frequency.exponentialRampToValueAtTime(f2, a.currentTime+dur);
  g.gain.setValueAtTime(vol, a.currentTime); g.gain.exponentialRampToValueAtTime(.001, a.currentTime+dur);
  o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime+dur);
}
const sfx = {
  slap(){ noise(.13,{freq:1600,q:.6,vol:1}); tone(160,50,.12,.5); },
  crackle(){ noise(.025,{freq:4500+Math.random()*2500,q:3,vol:.22}); },
  exhale(d){ noise(d,{freq:900,q:.4,vol:.4,type:'lowpass',curve:-1}); },
  cough(){ noise(.18,{freq:500,q:.8,vol:.9}); setTimeout(()=>noise(.16,{freq:450,q:.8,vol:.8}),220); setTimeout(()=>noise(.2,{freq:420,q:.8,vol:.7}),430); },
  lighter(){ noise(.05,{freq:6000,q:2,vol:.5}); setTimeout(()=>noise(.6,{freq:800,q:.5,vol:.25,curve:-1}),80); },
  fire(){ noise(2.2,{freq:500,q:.4,vol:.35,curve:-1}); },
  no(){ tone(300,180,.25,.2,'square'); },
  coin(){ tone(988,988,.08,.2,'square'); setTimeout(()=>tone(1319,1319,.25,.2,'square'),80); },
};
const buzz = ms => { try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} };
function say(text){ // 有粤语语音就用粤语读出来
  try{
    if(!window.speechSynthesis) return;
    const u = new SpeechSynthesisUtterance(text.replace(/[～~！!？?，,。]/g,' '));
    const v = speechSynthesis.getVoices().find(v => /zh[-_]HK|yue/i.test(v.lang));
    if(v) u.voice = v; u.lang = 'zh-HK'; u.rate = 1.1; u.pitch = 1.25;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}

/* =========================================================
   3D 引擎公共部分
   ========================================================= */
const T = THREE;
const rand = (a,b) => a + Math.random()*(b-a);
const stage = $('#stage');
let renderer, scene, camera, game = null, raf = 0, shakeAmt = 0;
const clock = new T.Clock();

function makeTex(draw, w=128, h=w){ const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const tx = new T.CanvasTexture(c); tx.anisotropy = 4; return tx; }
const smokeTex = makeTex((g,s) => {
  for(let i=0;i<16;i++){
    const x = s/2+rand(-s*.17,s*.17), y = s/2+rand(-s*.17,s*.17), r = rand(s*.14,s*.3);
    const gr = g.createRadialGradient(x,y,0,x,y,r); gr.addColorStop(0,'rgba(255,255,255,.32)'); gr.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(0,0,s,s);
  }
});
const glowTex = makeTex((g,s) => { const gr = g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2); gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(.25,'rgba(255,200,120,.8)'); gr.addColorStop(1,'rgba(255,80,0,0)'); g.fillStyle = gr; g.fillRect(0,0,s,s); });

// 粒子（烟、火、灰尘）
function Puffs(tex, blending = T.NormalBlending){
  const list = [], pool = [];
  return {
    spawn(o){
      let s = pool.pop();
      if(!s) s = new T.Sprite(new T.SpriteMaterial({map:tex, transparent:true, depthWrite:false, blending, fog:true}));
      s.material.color.set(o.color ?? 0xffffff); s.material.rotation = Math.random()*6.28; s.material.opacity = 0;
      s.position.copy(o.pos); s.scale.set(o.s0, o.s0, 1); scene.add(s);
      list.push({s, v:o.vel.clone(), t:0, life:o.life, s0:o.s0, s1:o.s1, op:o.op, spin:o.spin ?? rand(-.6,.6), drag:o.drag ?? .98, up:o.up ?? 0, sway:o.sway ?? 0, ph:Math.random()*6});
    },
    update(dt){
      for(let i=list.length-1;i>=0;i--){
        const p = list[i]; p.t += dt; const k = p.t/p.life;
        if(k >= 1){ scene.remove(p.s); pool.push(p.s); list.splice(i,1); continue; }
        p.v.multiplyScalar(Math.pow(p.drag, dt*60)); p.v.y += p.up*dt;
        p.s.position.addScaledVector(p.v, dt);
        if(p.sway) p.s.position.x += Math.sin(p.t*2.2+p.ph)*p.sway*dt;
        const sc = p.s0 + (p.s1-p.s0)*(1-Math.pow(1-k,2)); p.s.scale.set(sc,sc,1);
        p.s.material.rotation += p.spin*dt;
        p.s.material.opacity = p.op * (k < .12 ? k/.12 : 1-(k-.12)/.88);
      }
    },
    clear(){ list.forEach(p => { scene.remove(p.s); pool.push(p.s); }); list.length = 0; },
    get count(){ return list.length; }
  };
}

function initRenderer(){
  if(renderer) return;
  renderer = new T.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = T.PCFSoftShadowMap;
  stage.prepend(renderer.domElement);
  const el = renderer.domElement;
  el.addEventListener('pointerdown', e => { ac(); el.setPointerCapture(e.pointerId); game && game.down && game.down(ndc(e), e); });
  el.addEventListener('pointerup', () => game && game.up && game.up());
  el.addEventListener('pointercancel', () => game && game.up && game.up());
  window.addEventListener('resize', resize);
}

const std = (color, o={}) => new T.MeshStandardMaterial(Object.assign({color, roughness:.8}, o));

function box(w, h, d, mat){ const m = new T.Mesh(new T.BoxGeometry(w, h, d), mat); m.castShadow = true; m.receiveShadow = true; return m; }

const UP = new T.Vector3(0,1,0);
function stretch(mesh, a, b){ // 让一根单位长度圆柱连接 a → b

function SmokeGame(){
  scene = new T.Scene();
  scene.background = new T.Color(0x0d0b11); scene.fog = new T.Fog(0x0d0b11, 6, 16);
  camera = new T.PerspectiveCamera(42, 1, .05, 40);
  const G = { camPos:new T.Vector3(.3,.7,5), camLook:new T.Vector3(.35,-.15,0) };
  const baseCam = G.camPos.clone();

  scene.add(new T.AmbientLight(0x5c5270, .75));
  const key = new T.DirectionalLight(0xffe2c4, .9); key.position.set(-3,5,3); key.castShadow = true; key.shadow.mapSize.set(1024,1024); scene.add(key);
  const rim = new T.DirectionalLight(0x5f7dff, .55); rim.position.set(3,1.5,-4); scene.add(rim);

  // 桌子（木纹）
  const wood = makeTex((g,w,h) => { g.fillStyle='#3a2516'; g.fillRect(0,0,w,h); for(let i=0;i<70;i++){ g.strokeStyle=`rgba(${rand(10,40)},${rand(5,20)},0,${rand(.15,.4)})`; g.lineWidth=rand(1,4); g.beginPath(); const y=rand(0,h); g.moveTo(0,y); g.bezierCurveTo(w*.3,y+rand(-12,12),w*.6,y+rand(-12,12),w,y+rand(-6,6)); g.stroke(); } }, 512);
  wood.wrapS = wood.wrapT = T.RepeatWrapping; wood.repeat.set(3,3);
  const table = new T.Mesh(new T.PlaneGeometry(30,30), std(0xffffff,{map:wood, roughness:.7})); table.rotation.x = -Math.PI/2; table.position.y = -1; table.receiveShadow = true; scene.add(table);

  // 烟灰缸
  const pts = [[0,0],[.72,0],[.82,.22],[.76,.24],[.64,.07],[0,.07]].map(p => new T.Vector2(p[0],p[1]));
  const tray = new T.Mesh(new T.LatheGeometry(pts, 48), std(0x38505e,{roughness:.15, metalness:.3, transparent:true, opacity:.92}));
  tray.position.set(1.15,-1,.1); tray.castShadow = true; tray.receiveShadow = true; scene.add(tray);

  // 香烟
  const cig = new T.Group(); cig.position.set(-1.75,.05,.95); cig.rotation.set(0,.27,.05); scene.add(cig);
  const stick = new T.Group(); stick.rotation.z = -Math.PI/2; cig.add(stick);
  const filterTex = makeTex((g,w,h) => { g.fillStyle='#d7893c'; g.fillRect(0,0,w,h); for(let i=0;i<500;i++){ g.fillStyle=`rgba(${rand(120,200)},${rand(60,100)},20,.7)`; g.fillRect(rand(0,w),rand(0,h),2,2); } }, 128);
  const R = .11, FL = .8, L0 = 2.4;
  const filter = cyl(R, R, 1, std(0xffffff,{map:filterTex})); filter.scale.y = FL; filter.position.y = FL/2; stick.add(filter);
  const band = cyl(R*1.005, R*1.005, .035, std(0xd4af37,{metalness:.7, roughness:.3})); band.position.y = FL+.03; stick.add(band);
  const paper = cyl(R, R, 1, std(0xf3f0e8,{roughness:.9})); stick.add(paper);
  const char = cyl(R*1.01, R*1.01, .03, std(0x2b1d15)); stick.add(char);
  const emberMat = std(0x200800,{emissive:0xff3300, emissiveIntensity:1});
  const ember = cyl(R*.98, R*.98, .07, emberMat); stick.add(ember);
  const ash = cyl(R*.96, R*.9, 1, std(0x8d8984,{roughness:1})); stick.add(ash);
  const tipLight = new T.PointLight(0xff5a1a, 1, 3.2); scene.add(tipLight);
  const glow = new T.Sprite(new T.SpriteMaterial({map:glowTex, color:0xff6a2a, transparent:true, depthWrite:false, blending:T.AdditiveBlending}));
  scene.add(glow);

  const smoke = Puffs(smokeTex), flame = Puffs(glowTex, T.AdditiveBlending);
  let L = L0, ashLen = 0, lit = false, holding = false, inhale = 0, puffs = 0, cigs = 0, exhaleLeft = 0, exhaleRate = 0, exhaleK = 1;
  let crackT = 0, idleT = 0, emberI = 0, lightAnim = 0, done = false;
  const fallen = [];
  const tipW = new T.Vector3(), ashW = new T.Vector3(), tmp = new T.Vector3();

  function layout(){
    paper.scale.y = Math.max(.001, L); paper.position.y = FL + L/2;
    char.position.y = FL + L - .005;
    ember.position.y = FL + L + .03;
    ash.visible = ashLen > .01; ash.scale.y = Math.max(.001, ashLen); ash.position.y = FL + L + .065 + ashLen/2;
    paper.visible = char.visible = L > .005;
  }
  function score(){ setScore(`${puffs}${t('puffs')} · ${cigs}${t('cigs')}`); }
  function offer(first){
    lit = false; done = true;
    center(`<h2>${first ? t('sLight') : t('sDone')}</h2><div class="lbl">${PRICES[currency]} ${t('sUnit')}</div><button class="btn gold" id="buyCig">${first ? t('sLightBtn') : t('sAgain')}</button>`);
    $('#buyCig').onclick = () => pay(t('payS'), ok => { if(!ok) return; center(''); newCig(); });
  }
  function newCig(){
    fallen.forEach(f => scene.remove(f.m)); fallen.length = 0;
    L = L0; ashLen = 0; inhale = 0; done = false; lightAnim = 1.2; sfx.lighter(); layout();
    hint(t('sHint'));
  }
  function dropAsh(){
    if(ashLen < .06) return;
    const m = ash.clone(); m.material = ash.material;
    ash.getWorldPosition(ashW); ash.getWorldQuaternion(m.quaternion);
    m.position.copy(ashW); m.scale.set(1, ashLen, 1); scene.add(m);
    fallen.push({m, vy:0, rest:false, vr:rand(-3,3)}); ashLen = 0; layout();
    if(fallen.length > 14) scene.remove(fallen.shift().m);
  }
  function startExhale(k){
    const n = Math.round(12 + k*40);
    exhaleLeft = n; exhaleRate = n / (0.6 + k*.9); exhaleK = k;
    sfx.exhale(.7 + k*1.2);
  }
  function emitExhale(){
    const dir = G.camLook.clone().sub(camera.position).normalize();
    const mouth = camera.position.clone().addScaledVector(dir, 1.7); mouth.y -= .6;
    const v = dir.clone().multiplyScalar(rand(1.4, 2.6) + exhaleK).add(new T.Vector3(rand(-.45,.45), rand(.05,.45), rand(-.2,.2)));
    smoke.spawn({pos:mouth, vel:v, life:rand(2.6,4.2), s0:rand(.1,.25), s1:rand(1.4,2.6)*(.7+exhaleK*.5), op:rand(.12,.22), color:0xdcdce6, drag:.965, up:.12, sway:.25});
  }
  layout(); score();
  offer(true);

  G.fit = a => {
    if(a < 1){ // 竖屏：香烟斜着指向远处，整根都看得到
      cig.position.set(-1.05,.1,2.0); cig.rotation.set(0,.95,.06);
      tray.position.set(.75,-1,-.55); baseCam.set(.15,1.0,5.6); G.camLook.set(.05,-.2,.3);
    } else {
      cig.position.set(-1.75,.05,.95); cig.rotation.set(0,.27,.05);
      tray.position.set(1.15,-1,.1); baseCam.set(.3,.7,5); G.camLook.set(.35,-.15,0);
    }
    G.camPos.copy(baseCam);
  };
  G.down = () => {
    if(!lit) return;
    holding = true; inhale = 0; dropAsh();
  };
  G.up = () => {
    if(!holding) return;
    holding = false;
    if(inhale > .12){ puffs++; score(); startExhale(Math.min(1, inhale/2.6)); }
    inhale = 0;
  };
  G.update = dt => {
    // 点火
    if(lightAnim > 0){
      lightAnim -= dt; ember.getWorldPosition(tipW);
      if(Math.random() < .8) flame.spawn({pos:tipW.clone().add(new T.Vector3(.08,-.05,0)), vel:new T.Vector3(rand(-.05,.05),rand(.4,.8),0), life:rand(.2,.4), s0:.25, s1:.05, op:.9, color:0xffa040, drag:1});
      emberI = Math.min(1.6, emberI + dt*2.5);
      if(lightAnim <= 0){ lit = true; }
    }
    // 吸
    let target = lit ? .9 + Math.sin(performance.now()/180)*.15 : (lightAnim>0 ? emberI : 0);
    if(holding && lit){
      inhale += dt; target = 4.2;
      const burn = .2*dt; L -= burn; ashLen += burn*.9;
      crackT -= dt; if(crackT <= 0){ sfx.crackle(); crackT = rand(.05,.14); }
      $('#lung').style.display = 'block'; $('#lung i').style.width = Math.min(100, inhale/2.6*100) + '%';
      G.camPos.lerp(tmp.copy(baseCam).multiplyScalar(.9), dt*2);
      if(inhale > 3.2){ // 吸太久会咳
        holding = false; puffs++; score(); startExhale(1.1); sfx.cough(); shakeAmt = .12; buzz([60,60,60]);
        floatText(new T.Vector3(0,.8,1), t('cough'), '#fff', 28); inhale = 0;
      }
    } else {
      if(lit){ L -= .006*dt; ashLen += .005*dt; }
      $('#lung').style.display = 'none';
      G.camPos.lerp(baseCam, dt*2);
    }
    emberI += (target - emberI) * Math.min(1, dt*6);
    emberMat.emissiveIntensity = Math.max(.02, emberI);
    emberMat.emissive.setHSL(.03 + emberI*.01, 1, .5);
    if(ashLen > .45 && !holding) dropAsh();
    if(lit && L <= 0){ L = 0; lit = false; holding = false; cigs++; score(); setTimeout(() => offer(false), 900); hint(''); }
    layout();

    ember.getWorldPosition(tipW);
    tipLight.position.copy(tipW); tipLight.intensity = emberI*.9;
    glow.position.copy(tipW); const gs = .25 + emberI*.12; glow.scale.set(gs,gs,1); glow.material.opacity = Math.min(1, emberI*.5);

    // 烟头自己冒的细烟
    idleT -= dt;
    if((lit || emberI > .2) && idleT <= 0){
      idleT = holding ? .12 : .06;
      ash.getWorldPosition(ashW); const from = ashLen > .02 ? tmp.copy(ashW).lerp(tipW,.3) : tipW;
      smoke.spawn({pos:from.clone(), vel:new T.Vector3(rand(-.03,.03), rand(.25,.4), rand(-.03,.03)), life:rand(3,4.5), s0:.06, s1:rand(.5,.9), op:.16, color:0xc8c8d2, drag:.995, up:.05, sway:.35});
    }
    // 呼出来的烟
    if(exhaleLeft > 0){ let n = exhaleRate*dt; while(n > 0 && exhaleLeft > 0){ if(n >= 1 || Math.random() < n) { emitExhale(); exhaleLeft--; } n--; } }
    // 掉下去的烟灰
    for(const f of fallen){
      if(f.rest) continue;
      f.vy -= 9*dt; f.m.position.y += f.vy*dt; f.m.rotation.z += f.vr*dt;
      const floor = Math.hypot(f.m.position.x-tray.position.x, f.m.position.z-tray.position.z) < .7 ? -.93 : -.97;
      if(f.m.position.y < floor){ f.m.position.y = floor; f.rest = true; f.m.rotation.set(0, rand(0,3), Math.PI/2); f.m.scale.x = 1.3;
        for(let i=0;i<4;i++) smoke.spawn({pos:f.m.position.clone(), vel:new T.Vector3(rand(-.3,.3),rand(.1,.3),rand(-.3,.3)), life:1, s0:.05, s1:.3, op:.25, color:0x999999}); }
    }
    smoke.update(dt); flame.update(dt);
  };
  G.stop = () => { smoke.clear(); flame.clear(); };
  return G;
}

function pixTex(w, h, draw, rep){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); g.imageSmoothingEnabled = false; draw(g, w, h);
  const tx = new T.CanvasTexture(c); tx.magFilter = T.NearestFilter; tx.minFilter = T.NearestFilter; tx.generateMipmaps = false;
  if(rep){ tx.wrapS = tx.wrapT = T.RepeatWrapping; tx.repeat.set(rep[0], rep[1]); }
  return tx;
}
function jit(hex, a){ const c = new T.Color(hex), k = 1 + rand(-a, a); return `rgb(${Math.min(255,c.r*255*k)|0},${Math.min(255,c.g*255*k)|0},${Math.min(255,c.b*255*k)|0})`; }
function noiseFill(g, x0, y0, w, h, hex, a){ for(let y=y0;y<y0+h;y++) for(let x=x0;x<x0+w;x++){ g.fillStyle = jit(hex, a); g.fillRect(x,y,1,1); } }
const lam = (o) => new T.MeshLambertMaterial(typeof o === 'number' ? {color:o} : o);
function vbox(w, h, d, mat){ const m = new T.Mesh(new T.BoxGeometry(w, h, d), mat); m.castShadow = true; m.receiveShadow = true; return m; }

// 方块粒子
function Cubes(){
  const list = [], geo = new T.BoxGeometry(1,1,1), cache = {};
  const mat = (c, glow) => cache[c+'_'+glow] || (cache[c+'_'+glow] = glow ? new T.MeshBasicMaterial({color:c}) : new T.MeshLambertMaterial({color:c}));
  return {
    spawn(o){
      const m = new T.Mesh(geo, mat(o.color, !!o.glow)); m.position.copy(o.pos); m.scale.setScalar(o.size);
      m.rotation.set(rand(0,3), rand(0,3), 0); scene.add(m);
      list.push({m, v:o.vel.clone(), g:o.g ?? -7, life:o.life, t:0, s:o.size, floor:o.floor ?? -1});
    },
    update(dt){
      for(let i=list.length-1;i>=0;i--){
        const p = list[i]; p.t += dt; const k = p.t/p.life;
        if(k >= 1){ scene.remove(p.m); list.splice(i,1); continue; }
        p.v.y += p.g*dt; p.m.position.addScaledVector(p.v, dt);
        if(p.m.position.y < p.floor + p.s/2){ p.m.position.y = p.floor + p.s/2; p.v.x *= .5; p.v.z *= .5; p.v.y *= -.25; }
        p.m.scale.setScalar(p.s * (1 - k*k));
      }
    },
    clear(){ list.forEach(p => scene.remove(p.m)); list.length = 0; }
  };
}

// 语音识别
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function lev(a, b){
  const m = a.length, n = b.length, d = Array.from({length:m+1}, (_, i) => [i, ...Array(n).fill(0)]);
  for(let j=1;j<=n;j++) d[0][j] = j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++) d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1] + (a[i-1]===b[j-1]?0:1));
  return d[m][n];
}
const normZh = s => (s||'').replace(/[父]/g,'傅').replace(/[^㐀-鿿A-Za-z0-9]/g,'').toLowerCase();
function similarity(heard, targets){
  const h = [...normZh(heard)];
  return Math.max(...targets.map(tg => { const tt = [...normZh(tg)]; return 1 - lev(h, tt)/Math.max(h.length, tt.length, 1); }));
}

    setTimeout(nameUI, 300);
  }
  // 第二步：讲出小人个名
  function nameUI(){
    step = 'name'; state = 'name';
    if(srBroken){
      tools(`<input id="vname" maxlength="8" placeholder="${t('vNameIn')}"><button class="btn" id="vgive" style="padding:10px 14px">${t('vGive')}</button>`);
      const give = () => { const s = $('#vname').value.trim(); if(!s) return; /[㐀-鿿]/.test(s) ? nameOK(s) : refuse(s.slice(0,12)); };
      $('#vgive').onclick = give; $('#vname').onkeydown = e => { if(e.key === 'Enter') give(); };
      return;
    }
    tools(`<div class="phrase"><div class="zh" style="font-size:19px">${t('vSayName')}</div><div class="lbl" style="margin-top:4px">${t('vNameEg')}</div></div>${dialectPills()}
      <button class="btn mic" id="mic" data-idle="${t('vMic')}">${t('vMic')}</button><div class="heard" id="heard"></div>${refusals ? tries() : ''}`);
    bindPills(nameUI);
    $('#mic').onclick = () => listen(txt => { $('#heard').textContent = t('vHeard') + '「' + txt + '」'; },
      (res, err) => micDone(res, err, heard => {
        const n = heard.replace(/[^㐀-鿿A-Za-z0-9]/g,'');
        if(/[㐀-鿿]/.test(n)) nameOK(n);
        else refuse(heard.length > 12 ? heard.slice(0,12)+'…' : heard);
      }), $('#mic'));
  }
  function nameOK(n){
    name = [...n].slice(0,8).join(''); nod = 1; resetPaper();
    speak(`「${name}」系咪？好，交俾我！`, `"${name}", right? OK, leave it to me!`);
    tools('');
    setTimeout(() => pay(t('payV'), ok => {
      if(!ok){ speak('唔俾钱？咁唔打喇。', 'Not paying? Then no beating.'); nameUI(); return; }
      closeUp();
    }), 900);
  }
  function refuse(h){
    const r = REFUSE[refusals % REFUSE.length]; refusals++;
    speak(r[0](h), r[1](h)); shakeHead = 1.3; sfx.no(); buzz(80);
    if(refusals >= MAX_TRIES) setTimeout(gameOver, 1600);
    else step === 'ask' ? askUI() : nameUI();
  }
  // 搞笑结局：婆婆收工
  function gameOver(){
    state = 'over'; tools(''); turnAway = 1;
    speak('唔该你行开啦，听唔明，收工！', 'Please go away. Don\'t understand. I\'m closing up!', 2600);
    setTimeout(() => {
      center(`<div style="font-size:60px">😂</div><h2>${t('vOverT')}</h2><div class="lbl" style="max-width:300px">${t('vOverD')}</div><button class="btn gold" id="retry">${t('vRetry')}</button>`);
      $('#retry').onclick = () => { center(''); refusals = 0; turnAway = 0; speak('又系你？好啦，你要做咩呀？', 'You again? Fine, what do you want?'); askUI(); };
    }, 1800);
  }
  // ---- 扣运势 ----
  const LUCK = [
    {k:'气运', en:'Luck', bar:1}, {k:'财运', en:'Wealth', bar:1}, {k:'桃花运', en:'Romance', bar:1}, {k:'事业运', en:'Career', bar:1}, {k:'人缘', en:'Friends', bar:1},
    {k:'头发', en:'Hair', u:' 根', ue:' strands', mul:3}, {k:'智商', en:'IQ'}, {k:'颜值', en:'Looks'}, {k:'手机电量', en:'Battery', u:'%', ue:'%'},
    {k:'WiFi 信号', en:'WiFi', u:' 格', ue:' bar'}, {k:'抽奖运', en:'Lottery luck'}, {k:'睡眠', en:'Sleep', u:' 小时', ue:'h'},
    {k:'塞车几率', en:'Traffic jams', plus:1, u:'%', ue:'%', mul:5}, {k:'踩到狗屎几率', en:'Dog-poop chance', plus:1, u:'%', ue:'%', mul:5},
    {k:'迟到几率', en:'Late-for-work chance', plus:1, u:'%', ue:'%', mul:5}, {k:'外卖送错', en:'Wrong deliveries', plus:1, u:' 次', ue:''},
    {k:'红灯', en:'Red lights', plus:1, u:' 个', ue:''}, {k:'被老板骂', en:'Scolded by boss', plus:1, u:' 次', ue:'x'},
  ];
  let luck = {}, lost = {}, bottomed = false, boostUntil = 0;
  function resetLuck(){ luck = {}; lost = {}; bottomed = false; LUCK.forEach(l => { if(l.bar) luck[l.k] = 100; lost[l.k] = 0; }); renderLuck(); }
  const lname = l => lang === 'zh' ? l.k : l.en;
  function renderLuck(){
    const el = $('#luck');
    const hair = lost['头发'] ? `<div class="x">${lang==='zh'?'头发':'Hair'} -${lost['头发']}${lang==='zh'?' 根':''}</div>` : '';
    el.innerHTML = `<b>「${name || '小人'}」${t('vLuckT')}</b>` + LUCK.filter(l => l.bar).map(l => `<div class="r"><span>${lname(l)}</span><div class="bar"><i style="width:${luck[l.k]}%"></i></div></div>`).join('') + hair;
  }
  function deduct(h, mult, crit){
    const pick = Math.random() < .45 ? LUCK[0] : LUCK[(Math.random()*LUCK.length)|0];
    const n = (((Math.random()*3)|0) + 1) * (pick.mul || 1) * mult;
    lost[pick.k] = (lost[pick.k]||0) + n;
    if(pick.bar) luck[pick.k] = Math.max(0, luck[pick.k] - n);
    const unit = lang === 'zh' ? (pick.u || '') : (pick.ue ?? '');
    const txt = `${lname(pick)} ${pick.plus ? '+' : '-'}${n}${unit}`;
    const at = h.point.clone().add(new T.Vector3(rand(-.25,.25), .25, rand(-.1,.1)));
    floatText(at, (crit ? '💥' : '') + txt, crit ? '#ff3b3b' : (pick.plus ? '#ff9d5c' : '#c58bff'), crit ? 26 : 19);
    if(!bottomed && luck['气运'] === 0){ bottomed = true; floatText(new T.Vector3(0,paperY+.5,.1), t('vBottom'), '#ff3b3b', 30); speak('哈哈，衰到贴地喇！继续打！', 'Haha, totally out of luck! Keep going!'); }
    renderLuck();
  }

  // ---- 念咒 / 骂佢（边打边讲） ----
  const MCHANTS = [
    ['打你个小人头，打到你出门就摔跤！', 'dǎ nǐ gè xiǎo rén tóu, dǎ dào nǐ chū mén jiù shuāi jiāo!'],
    ['打你个小人手，打到你钱包天天丢！', 'dǎ nǐ gè xiǎo rén shǒu, dǎ dào nǐ qián bāo tiān tiān diū!'],
    ['打你个小人脚，打到你鞋带天天掉！', 'dǎ nǐ gè xiǎo rén jiǎo, dǎ dào nǐ xié dài tiān tiān diào!'],
    ['打你个小人嘴，打到你讲话没人理！', 'dǎ nǐ gè xiǎo rén zuǐ, dǎ dào nǐ jiǎng huà méi rén lǐ!'],
  ];
  let chantIdx = 0, chanting = false, crec = null, autoQ = [], autoT = 0;
  function chantLine(){ return dialect === 'mand' ? MCHANTS[chantIdx % MCHANTS.length] : [CHANTS[chantIdx % CHANTS.length][0], '']; }
  function randomHit(){ const x = rand(-PW/2+.12, PW/2-.12), z = paperZ + rand(-PH/2+.15, PH/2-.15); return {point:new T.Vector3(x,paperY,z), uv:new T.Vector2(x/PW+.5, (paperZ-z)/PH+.5)}; }
  function onSpoken(txt){
    txt = (txt || '').trim(); if(!txt) return;
    const short = [...txt].length > 14 ? [...txt].slice(0,14).join('') + '…' : txt;
    floatText(new T.Vector3(rand(-.2,.2), paperY+.55, rand(-.2,.3)), `「${short}」`, '#ffffff', 26);
    const len = [...txt.replace(/\s/g,'')].length;
    const hitName = name && normZh(txt).includes(normZh(name));
    const isChant = similarity(txt, [chantLine()[0]]) > .5;
    const n = Math.max(3, Math.min(10, Math.ceil(len/2))) + (isChant ? 4 : 0);
    boostUntil = performance.now() + 3500;
    for(let i=0;i<n;i++) autoQ.push({crit: hitName || isChant});
    if(hitName) floatText(new T.Vector3(0,paperY+.75,0), t('vNameCrit'), '#ff3b3b', 28);
    else if(isChant){ floatText(new T.Vector3(0,paperY+.75,0), t('vChantOK'), '#ffd34d', 28); chantIdx++; renderChant(); }
    shakeAmt = .06;
  }
  function renderChant(){
    const c = chantLine(), el = $('#chantBox'); if(!el) return;
    el.innerHTML = `<div class="lbl">${t('vChantT')}</div><div class="zh">${c[0]}</div>${c[1] ? `<div class="py">${c[1]}</div>` : ''}<div class="lbl" style="margin-top:3px">${t('vChantOr').replace('{n}', name)}</div>`;
  }
  function chantToggle(){
    const btn = $('#vchant');
    if(chanting){ chanting = false; if(crec) try{ crec.stop(); }catch(e){} btn.classList.remove('rec'); btn.textContent = t('vChantBtn'); return; }
    chanting = true; btn.classList.add('rec'); btn.textContent = t('vChantStop');
    const start = () => {
      if(!chanting) return;
      try{ crec = new SR(); crec.lang = PHRASES[dialect].code; crec.continuous = true; crec.interimResults = true; }catch(e){ chanting = false; return; }
      crec.onresult = e => { for(let i=e.resultIndex;i<e.results.length;i++){ const r = e.results[i]; if(r.isFinal) onSpoken(r[0].transcript); else { const hd = $('#heard'); if(hd) hd.textContent = '🎙️ ' + r[0].transcript; } } };
      let fatal = false;
      crec.onerror = e => { if(e.error === 'not-allowed' || e.error === 'service-not-allowed' || e.error === 'network'){ fatal = true; } };
      crec.onend = () => { crec = null; if(chanting && !fatal) setTimeout(start, 150); else if(fatal){ chanting = false; const b = $('#vchant'); if(b){ b.classList.remove('rec'); b.textContent = t('vChantBtn'); } } };
      try{ crec.start(); }catch(e){}
    };
    start();
  }
  function hitTools(){
    tools(`<div class="chant" id="chantBox"></div><div class="heard" id="heard"></div>` +
      (srBroken
        ? `<input id="curse" maxlength="30" placeholder="${t('vCurseIn')}"><button class="btn" id="curseBtn" style="padding:10px 14px">${t('vSend')}</button>`
        : `<button class="btn mic" id="vchant" style="flex:2">${t('vChantBtn')}</button>`) +
      `<button class="btn ghost" id="vfinish" style="flex:1;${srBroken?'width:100%':''}">${t('vFinish')}</button>`);
    renderChant();
    if(srBroken){ const go = () => { onSpoken($('#curse').value); $('#curse').value = ''; }; $('#curseBtn').onclick = go; $('#curse').onkeydown = e => { if(e.key === 'Enter') go(); }; }
    else $('#vchant').onclick = chantToggle;
    $('#vfinish').onclick = finish;
  }
  function stopChant(){ chanting = false; autoQ = []; if(crec) try{ crec.abort(); }catch(e){} crec = null; }

  // 特写：悬空拖鞋，任你拍
  function closeUp(){
    view = 'close'; camTargets(); state = 'hit'; slipper.visible = true; pose(hover, hover, 1);
    setScore(`0${t('hits')}`); hint(t('vHint'));
    speak('好！拖鞋交俾你，拍到你爽为止！边打边念佢个名，仲劲！', 'Here\'s the slipper — slap till you feel better! Say their name while you hit — even stronger!', 3200);
    resetLuck(); $('#luck').style.display = 'block'; hitTools();
  }
  function finish(){
    state = 'done'; hint(''); tools(''); stopChant();
    speak('打走小人，好运自然来！', 'Villain gone, good luck comes!', 2200);
    floatText(new T.Vector3(0,paperY+.4,.1), '✨ 好运来 ✨', '#ffe08a', 32); sfx.coin();
    for(let i=0;i<30;i++) cubes.spawn({pos:new T.Vector3(rand(-.5,.5), paperY+.1, paperZ+rand(-.7,.7)), vel:new T.Vector3(rand(-.5,.5), rand(1.5,3), rand(-.5,.5)), g:-3, life:rand(.8,1.4), size:rand(.03,.06), color:[0xffd34d,0xff7a3d,0xffffff][i%3], glow:true, floor:paperY});
    setTimeout(() => {
      const top = LUCK.filter(l => lost[l.k]).sort((a,b) => lost[b.k]-lost[a.k]).slice(0,6)
        .map(l => `${lname(l)} ${l.plus?'+':'-'}${lost[l.k]}${lang==='zh'?(l.u||''):(l.ue??'')}`).join(' · ');
      center(`<h2>${t('vDoneT')}</h2><div class="lbl">${hits}${t('hits')}</div><div style="color:#c58bff;font-size:14px;max-width:320px">${top}</div><div class="lbl">${PRICES[currency]} ${t('vUnit')}</div><button class="btn gold" id="again">${t('vAgain')}</button>`);
      $('#again').onclick = () => { center(''); $('#luck').style.display = 'none'; view = 'wide'; camTargets(); slipper.visible = false; resetPaper(); name = ''; refusals = 0; nameUI(); speak('仲有边个？俾个名我。', 'Who else? Give me a name.'); };
    }, 1200);
  }
  setTimeout(() => { speak('靓仔靓女，你要做咩呀？', 'Hey there, what do you want?'); askUI(); }, 400);

  // ---- 拍 ----
  const ray = new T.Raycaster(), floorPlane = new T.Plane(new T.Vector3(0,1,0), -paperY), tmpV = new T.Vector3();
  function hitAt(p){ // 点中纸就拍嗰度；点唔中就拍最近嘅位置
    ray.setFromCamera(p, camera);
    const h = ray.intersectObject(paper)[0];
    if(h) return {point:h.point, uv:h.uv};
    if(!ray.ray.intersectPlane(floorPlane, tmpV)) return null;
    const x = Math.max(-PW/2+.05, Math.min(PW/2-.05, tmpV.x)), z = Math.max(paperZ-PH/2+.05, Math.min(paperZ+PH/2-.05, tmpV.z));
    return {point:new T.Vector3(x, paperY, z), uv:new T.Vector2(x/PW+.5, (paperZ-z)/PH+.5)};
  }
  let holes = 0;
  function applyHit(h){
    hits++; setScore(`${hits}${t('hits')}`);
    sfx.slap(); buzz(25); shakeAmt = .035;
    const boosted = performance.now() < boostUntil, crit = h.crit || Math.random() < .08;
    deduct(h, (boosted ? 2 : 1) * (crit ? 3 : 1), crit);
    const pos = pGeo.attributes.position, lp = paper.worldToLocal(h.point.clone()), r = .3;
    for(let i=0;i<pos.count;i++){
      const dx = pos.getX(i)-lp.x, dy = pos.getY(i)-lp.y, d = Math.sqrt(dx*dx+dy*dy);
      if(d < r){ const f = Math.pow(1-d/r,1.5); pos.setZ(i, Math.max(-.008, Math.min(.12, pos.getZ(i) + f*rand(-.5,1)*.03))); }
    }
    pos.needsUpdate = true; pGeo.computeVertexNormals();
    const cx = Math.floor(h.uv.x*CW), cy = Math.floor((1-h.uv.y)*CH), g = pc;
    g.fillStyle = 'rgba(50,35,20,.12)'; g.fillRect(cx-6, cy-11, 12, 22);
    g.fillStyle = 'rgba(40,25,10,.22)'; for(let k=-9;k<=9;k+=4) g.fillRect(cx-5, cy+k, 10, 1);
    if(hits > 25 && holes < 40 && Math.random() < .25){ holes++; g.save(); g.globalCompositeOperation = 'destination-out'; g.fillRect(cx+((rand(-3,3))|0)*2, cy+((rand(-3,3))|0)*2, 3, 3); g.restore(); }
    pTex.needsUpdate = true;
    for(let i=0;i<6;i++) cubes.spawn({pos:h.point.clone(), vel:new T.Vector3(rand(-1.2,1.2),rand(1,2.2),rand(-1.2,1.2)), life:rand(.4,.8), size:rand(.025,.05), color:[0xe8d29a,0xc9b07a,0x7a6a50][i%3], floor:paperY});
    if(hits % 15 === 0){ const c = CHANTS[(hits/15-1) % CHANTS.length]; speak(c[0], c[1], 2200); }
    if(hits % 50 === 0) floatText(new T.Vector3(0,paperY+.5,.1), `🔥 ${hits} ${lang==='zh'?'下！':'hits!'}`, '#ff7a3d', 34);
  }
  G.down = (p) => { if(state !== 'hit') return; const h = hitAt(p); if(h) slapAt(h); };
  function slapAt(h){
    if(anim && !anim.applied) applyHit(anim.hit); // 拍得快都照计
    const hitPose = {p:new T.Vector3(h.point.x, paperY+.07, h.point.z+.04), r:new T.Euler(0, rand(-.35,.35), 0)};
    const raised = {p:new T.Vector3(h.point.x+.1, paperY+.5, h.point.z+.25), r:new T.Euler(-1.1, rand(-.2,.2), .15)};
    anim = {t:0, from:cur(), raised, hitPose, hit:h, applied:false};
  }
  G.fit = a => { aspect = a; camTargets(); G.camPos.copy(camTarget); G.camLook.copy(lookTarget); };
  let flameT = 0, idleT = 0;
  G.update = dt => {
    const now = performance.now();
    G.camPos.lerp(camTarget, Math.min(1, dt*3)); G.camLook.lerp(lookTarget, Math.min(1, dt*3));
    if(anim){
      anim.t += dt/.17; const k = anim.t;
      if(k < .4) pose(anim.from, anim.raised, easeOut(k/.4));
      else if(k < .6) pose(anim.raised, anim.hitPose, easeIn((k-.4)/.2));
      else {
        if(!anim.applied){ anim.applied = true; applyHit(anim.hit); }
        if(k < .7) pose(anim.hitPose, anim.hitPose, 1);
        else if(k < 1) pose(anim.hitPose, anim.raised, easeOut((k-.7)/.3));
        else { anim = null; idleT = 0; }
      }
    } else if(slipper.visible){ // 冇拍嘅时候慢慢飘返去旁边
      idleT += dt; const back = cur(), k = Math.min(1, idleT*2.5);
      const hv = {p:hover.p.clone().add(new T.Vector3(0, Math.sin(now/400)*.04, 0)), r:new T.Euler(hover.r.x, hover.r.y + Math.sin(now/700)*.15, hover.r.z)};
      pose(back, hv, k*.15);
    }
    const talking = now < talkUntil;
    mouth.scale.y = talking ? 1 + (Math.floor(now/90)%2)*2.5 : 1;
    if(shakeHead > 0){ shakeHead -= dt; headG.rotation.y = Math.sin(now/55)*.5*Math.min(1,shakeHead); } else headG.rotation.y *= .9;
    if(nod > 0){ nod -= dt; headG.rotation.x = Math.sin(now/90)*.25*nod; } else headG.rotation.x = 0;
    M.rotation.y += ((turnAway ? Math.PI : 0) - M.rotation.y) * Math.min(1, dt*3);
    body.position.y = 1.0 + (Math.floor(now/600)%2)*.01;
    if(bubbleOn){
      headG.getWorldPosition(headW); headW.y += .45; const s = toScreen(headW);
      const b = $('#bubble'); b.style.left = Math.max(110, Math.min(stage.clientWidth-110, s.x)) + 'px'; b.style.top = Math.max(b.offsetHeight+6, s.y) + 'px';
      if(!talking && now > talkUntil + 2500 && state === 'hit'){ b.style.display = 'none'; bubbleOn = false; }
    }
    flameT -= dt;
    flamesM.forEach((f,i) => { const s = 1 + Math.sin(now/70 + i*2)*.15; f.scale.set(1, s, 1); });
    if(flameT <= 0){ flameT = .12; for(const c of candles) if(Math.random()<.5) cubes.spawn({pos:c.clone().add(new T.Vector3(0,.06,0)), vel:new T.Vector3(rand(-.05,.05),.5,0), g:.2, life:.4, size:.03, color:0xffa040, glow:true});
      for(const c of incense) if(Math.random() < .3) cubes.spawn({pos:c.clone(), vel:new T.Vector3(rand(-.03,.03),.25,0), g:0, life:2.5, size:.035, color:0xbbbbbb}); }
    candleLight.intensity = (view === 'close' ? .45 : .9) + ((now/120|0)%3)*.06;
    if(autoQ.length && state === 'hit'){ autoT -= dt; if(autoT <= 0){ autoT = .12; const a = autoQ.shift(), h = randomHit(); h.crit = a.crit; slapAt(h); } }
    // 灯泡闪、灯笼摇、符纸飘、红眼眨
    if(bulbOff > 0){ bulbOff -= dt; bulbLight.intensity = 0; bulb.material.color.set(0x332a20); }
    else { bulbLight.intensity = .7 + Math.random()*.15; bulb.material.color.set(0xfff0b0); if(Math.random() < .006) bulbOff = rand(.05,.5); }
    lanterns.forEach((l,i) => { l.rotation.z = Math.sin(now/900 + i*2)*.08; l.rotation.x = Math.sin(now/1300 + i)*.05; });
    fus.forEach((f,i) => { f.rotation.x = Math.sin(now/500 + i*1.7)*.18; });
    eyeT -= dt; eyes.visible = eyeT < .9 && !(eyeT > .4 && eyeT < .5); if(eyeT < 0) eyeT = rand(4,9);
    bucketLight.intensity = 1 + Math.random()*.5;
    if(Math.random() < .5) cubes.spawn({pos:bucketFire.clone().add(new T.Vector3(rand(-.15,.15),0,rand(-.15,.15))), vel:new T.Vector3(rand(-.1,.1),rand(.6,1.1),rand(-.1,.1)), g:.6, life:rand(.3,.6), size:rand(.04,.08), color:[0xff7a1a,0xffc040,0xff3d10][(Math.random()*3)|0], glow:true});
    if(Math.random() < .08) cubes.spawn({pos:bucketFire.clone().add(new T.Vector3(0,.2,0)), vel:new T.Vector3(rand(-.1,.1),.5,0), g:0, life:2.5, size:.06, color:0x333333});
    cubes.update(dt);
  };
  G.stop = () => { cubes.clear(); stopChant(); if(rec){ try{ rec.abort(); }catch(e){} rec = null; } };
  return G;
}

applyI18n();
</script>
</body>

<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>解压小铺</title>
<style>
  :root{--bg:#141018;--card:#241d2c;--fg:#f5efe6;--muted:#b4a8bf;--accent:#ff5d5d;--gold:#ffc94d}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,"PingFang HK","PingFang SC","Microsoft JhengHei","Microsoft YaHei",sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
  .screen{position:fixed;inset:0;display:none;flex-direction:column}
  .screen.on{display:flex}
  #home{overflow-y:auto;padding:22px 16px 40px;align-items:center}
  h1{margin:6px 0 4px;font-size:34px;letter-spacing:2px}
  .sub{color:var(--muted);margin:0 0 16px;text-align:center;line-height:1.5}
  .row{display:flex;gap:8px;justify-content:center;margin:6px 0 14px;flex-wrap:wrap}
  .pill{background:#ffffff12;color:var(--fg);border:1px solid #ffffff30;border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer}
  .pill.sel{background:var(--gold);color:#222;border-color:var(--gold)}
  .cards{display:grid;gap:14px;width:100%;max-width:520px}
  .card{background:linear-gradient(135deg,#33263f,#211a28);border-radius:20px;padding:20px;cursor:pointer;display:flex;gap:16px;align-items:center;transition:transform .1s;border:1px solid #ffffff14}
  .card:active{transform:scale(.97)}
  .card .ico{font-size:52px;filter:drop-shadow(0 6px 10px #0008)}
  .card b{font-size:21px;display:block}
  .card span{color:var(--muted);font-size:13px;display:block;margin-top:4px}
  .card .price{color:var(--gold);font-weight:800;font-size:15px;margin-top:8px}
  .lbl{font-size:12px;color:var(--muted)}
  .btn{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:11px 20px;font-size:16px;font-weight:700;cursor:pointer}
  .btn.ghost{background:#ffffff1c}
  .btn.gold{background:var(--gold);color:#222}
  .small{font-size:12px;color:var(--muted);text-align:center}
  #game header{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#000a;z-index:3}
  #game header .t{flex:1;font-weight:700;font-size:17px}
  #game header .score{color:var(--gold);font-weight:700;font-size:14px;text-align:right}
  #stage{flex:1;position:relative;overflow:hidden}
  #stage canvas{display:block;width:100%;height:100%;touch-action:none}
  #tools{display:flex;gap:8px;padding:10px 12px;background:#000a;align-items:center;flex-wrap:wrap;z-index:3}
  #tools:empty{display:none}
  #tools input{flex:1;min-width:0;padding:10px;border-radius:10px;border:0;font-size:16px}
  .chip{background:#ffffff18;border:1px solid #ffffff33;color:#fff;border-radius:999px;padding:7px 12px;font-size:13px;cursor:pointer}
  #bubble{position:absolute;left:0;top:0;transform:translate(-50%,-100%);background:#fff;color:#222;border-radius:16px;padding:10px 14px;max-width:min(78vw,320px);font-size:16px;font-weight:700;line-height:1.4;box-shadow:0 8px 24px #0008;pointer-events:none;display:none;z-index:2}
  #bubble::after{content:"";position:absolute;left:50%;bottom:-9px;margin-left:-9px;border:9px solid transparent;border-bottom:0;border-top-color:#fff}
  #bubble small{display:block;font-weight:400;color:#777;font-size:13px;margin-top:4px}
  #hint{position:absolute;left:0;right:0;bottom:14px;text-align:center;color:#fffc;font-size:15px;pointer-events:none;text-shadow:0 2px 6px #000;padding:0 16px}
  #center{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;z-index:2;background:#0007;text-align:center;padding:16px}
  #center.on{display:flex}
  #center h2{margin:0;font-size:26px}
  #luck{position:absolute;left:10px;bottom:38px;background:#000b;border:1px solid #ff3b3b55;border-radius:12px;padding:8px 10px;font-size:12px;display:none;z-index:2;min-width:150px;pointer-events:none}
  #luck b{color:#ff6b6b;font-size:13px}
  #luck .r{display:flex;align-items:center;gap:6px;margin-top:4px}
  #luck .r span{width:52px;color:#ddd}
  #luck .bar{flex:1;height:7px;background:#ffffff22;border-radius:4px;overflow:hidden}
  #luck .bar i{display:block;height:100%;background:linear-gradient(90deg,#7b2ff7,#ff3b3b);transition:width .2s}
  #luck .x{color:#ffb3b3;margin-top:5px}
  .chant{width:100%;text-align:center;background:#3a0d12;border:1px solid #ff3b3b55;border-radius:12px;padding:8px}
  .chant .zh{font-size:16px;font-weight:800;color:#ffd7d7}
  .chant .py{font-size:13px;color:var(--gold)}
  #lung{position:absolute;left:50%;bottom:44px;width:min(60vw,260px);height:12px;margin-left:calc(min(60vw,260px)/-2);background:#0008;border-radius:6px;overflow:hidden;display:none}
  #lung i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb36b,#ff4d2e);border-radius:6px}
  .ft{position:absolute;transform:translate(-50%,-50%);font-weight:900;pointer-events:none;text-shadow:0 3px 8px #000;animation:ft 1.1s ease-out forwards;white-space:nowrap;z-index:2}
  @keyframes ft{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-70px}}
  .phrase{width:100%;text-align:center;background:#ffffff14;border-radius:14px;padding:10px 8px}
  .phrase .zh{font-size:24px;font-weight:800;margin-top:2px}
  .phrase .py{font-size:16px;color:var(--gold);margin-top:3px;letter-spacing:.5px}
  .mic{width:100%;padding:14px;font-size:18px}
  .mic.rec{background:#e11d48;animation:pulse 1s infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 8px #e11d4844}}
  .heard{width:100%;text-align:center;font-size:13px;color:var(--muted);min-height:18px}
  .bxtabs{display:flex;gap:8px;width:100%;justify-content:center}
  .bxrow{display:flex;align-items:center;gap:8px;width:100%}
  .bxrow>span{width:56px;flex:none;font-size:13px;color:var(--muted)}
  .bxrow>div{display:flex;gap:6px;flex-wrap:wrap;flex:1}
  .bxrow .pill{padding:5px 10px;font-size:13px}
  .sw{width:28px;height:28px;border-radius:50%;border:2px solid #ffffff33;cursor:pointer;padding:0}
  .sw.sel{border-color:var(--gold);box-shadow:0 0 0 2px #ffc94d66}
  .fb{flex:1;min-width:0;padding:0 2px;height:70px;border:0;border-radius:14px;background:#ffffff1f;color:#fff;font-size:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none}
  .fb small{font-size:11px;margin-top:2px}
  .fb em{font-style:normal;font-size:9px;opacity:.85;line-height:1.1;white-space:nowrap}
  .fb.orange{background:#e67e22cc}
  .fb.red{background:#d63031cc}.fb.blue{background:#2a6ad8cc}
  .fb.on{transform:scale(.93);filter:brightness(1.3)}
  #fhud{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;padding:8px 10px;z-index:2;pointer-events:none;background:linear-gradient(#000a,#0000)}
  #fhud .fs{flex:1;font-size:13px}
  #fhud .fs.r{text-align:right}
  #fhud .hp{height:12px;background:#0008;border:1px solid #fff5;border-radius:6px;overflow:hidden;margin-top:3px}
  #fhud .hp i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ffd34d,#ff7a3d);transition:width .15s}
  #fhud .fs.r .hp i{margin-left:auto;background:linear-gradient(90deg,#ff3b3b,#ff9d5c)}
  #fhud .ft2{font-size:24px;font-weight:900;color:#fff;min-width:40px;text-align:center;text-shadow:0 2px 6px #000}
  #hurtFlash{position:absolute;inset:0;pointer-events:none;background:radial-gradient(transparent 40%,#ff000099);opacity:0;transition:opacity .25s;z-index:1}
  #warnMark{position:absolute;transform:translate(-50%,-100%);font-size:34px;display:none;pointer-events:none;z-index:2;animation:pulse 0.3s infinite}
  .modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
  .modal.on{display:flex}
  .modal .box{background:#fff;color:#222;border-radius:18px;padding:22px;max-width:360px;width:100%;text-align:center}
  .modal .box h3{margin:8px 0 4px}
  .modal .box p{color:#555;font-size:14px}
  .tag{display:inline-block;background:#ffe9a8;color:#7a5600;border-radius:6px;padding:2px 8px;font-size:12px}
</style>
</head>
<body>

<section id="home" class="screen on">
  <h1 data-i="title"></h1>
  <p class="sub" data-i="sub"></p>
  <div class="lbl" data-i="langLbl"></div>
  <div class="row" id="langSel">
    <button class="pill sel" data-l="zh">中文</button>
    <button class="pill" data-l="en">English</button>
  </div>
  <div class="lbl" data-i="curLbl"></div>
  <div class="row" id="curSel">
    <button class="pill sel" data-c="MYR">RM 马币</button>
    <button class="pill" data-c="HKD">HK$ 港币</button>
    <button class="pill" data-c="USD">US$ 美金</button>
  </div>
  <div class="cards">
    <div class="card" data-g="villain"><div class="ico">🩴</div><div><b data-i="vName"></b><span data-i="vDesc"></span><div class="price"><span class="p"></span> <span data-i="vUnit" style="display:inline;color:inherit"></span></div></div></div>
    <div class="card" data-g="boxing"><div class="ico">🥊</div><div><b data-i="bName"></b><span data-i="bDesc"></span><div class="price"><span class="p"></span> <span data-i="bUnit" style="display:inline;color:inherit"></span></div></div></div>
    <div class="card" data-g="smoke"><div class="ico">🚬</div><div><b data-i="sName"></b><span data-i="sDesc"></span><div class="price"><span class="p"></span> <span data-i="sUnit" style="display:inline;color:inherit"></span></div></div></div>
  </div>
  <p class="small" style="margin-top:22px" data-i="foot"></p>
</section>

<section id="game" class="screen">
  <header>
    <button class="btn ghost" id="backBtn" style="padding:6px 12px;font-size:15px" data-i="back"></button>
    <div class="t" id="gTitle"></div>
    <div class="score" id="gScore"></div>
  </header>
  <div id="stage">
    <div id="bubble"></div>
    <div id="hint"></div>
    <div id="lung"><i></i></div>
    <div id="luck"></div>
    <div id="center"></div>
  </div>
  <div id="tools"></div>
</section>

<div class="modal" id="payModal">
  <div class="box">
    <span class="tag" data-i="demo"></span>
    <h3 id="payWhat"></h3>
    <div style="font-size:30px;font-weight:800;margin:6px 0" id="payAmt"></div>
    <p data-i="demoTxt"></p>
    <button class="btn" id="confirmPay" style="width:100%" data-i="payOk"></button>
    <button class="btn" id="cancelPay" style="width:100%;margin-top:8px;color:#555;background:#eee" data-i="cancel"></button>
  </div>
</div>

<script src="vendor/three.min.js"></script>
<script>
/* =========================================================
   文字 / 语言
   ========================================================= */
const I18N = {
  zh: {
    title:'解压小铺', sub:'压力大？进来发泄一下。<br>纯属游戏，玩完记得深呼吸 😮‍💨', langLbl:'语言', curLbl:'付款货币',
    vName:'打小人', vDesc:'方块婆婆问你要做咩——讲得出中文，就有拖鞋任你拍', vUnit:'/ 每打一张',
    bName:'办公室拳击', bDesc:'自己捏角色，把老板/同事做出来，在办公室对打', bUnit:'/ 每一场',
    sName:'抽根烟', sDesc:'深夜后巷，落魄打工仔的一根烟。按住吸，放开呼', sUnit:'/ 每一根',
    foot:'所有内容均为虚拟游戏。请勿用于伤害或骚扰任何真实人士。虚拟香烟零尼古丁，现实中吸烟有害健康。',
    back:'← 返回', demo:'演示模式', demoTxt:'这是付款流程的演示版，正式上线时会接入真正的支付渠道（Stripe / Touch \'n Go / FPX / PayMe 等）。',
    payOk:'模拟付款成功', cancel:'取消', payV:'打小人一次', payS:'香烟一根',
    puffs:'口', cigs:'根', hits:'下',
    sLight:'点一根？', sLightBtn:'🔥 买一根并点火', sHint:'按住 = 吸 · 放开 = 呼', sDone:'抽完了', sAgain:'🚬 再来一根', cough:'咳咳咳！',
    vTalk:'同师傅讲你想做咩…', vSend:'讲', vNameIn:'写上小人的名字 / 外号', vGive:'交俾师傅', vHint:'👆 狂点屏幕，拖鞋拍拍拍！', vAgain:'🩴 再打一个', vDoneT:'小人打走晒 ✨',
    vReadThis:'跟住读出来：', vMic:'🎤 点一下开始讲', vMicStop:'⏹ 讲完点这里', vHeard:'婆婆听到：', vAcc:'准确度', vMicDenied:'麦克风被拒绝了，请在浏览器设置里允许使用麦克风。', vNoSR:'这个浏览器不支持语音识别，请用中文打字跟师傅讲：', mand:'普通话', cant:'广东话', vTries:'剩下机会：', vSayName:'讲出你想打嘅人个名', vNameEg:'例如：衰老板、前度、霉运', vOverT:'婆婆：「听唔明，收工！」', vOverD:'婆婆完全听不懂你在讲什么，把你赶走了。', vRetry:'🙏 再求一次婆婆', vFinish:'😮‍💨 打爽了，收工', vLuckT:'嘅运势', vBottom:'💀 衰到贴地！', vChantT:'👄 边打边念：', vChantOr:'或者大声念「{n}」个名、骂佢都得！', vChantBtn:'🎤 念咒 / 骂佢', vChantStop:'🔴 念紧…（再按停）', vNameCrit:'🎯 念中个名！暴击！', vChantOK:'📿 咒语生效！连环拍！', vCurseIn:'打字骂佢 / 念咒…',
  },
  en: {
    title:'Stress Shop', sub:'Stressed out? Come let it out.<br>It\'s just a game — take a deep breath after 😮‍💨', langLbl:'Language', curLbl:'Currency',
    vName:'Villain Hitting', vDesc:'A blocky HK granny — if she understands your Chinese, you get the slipper', vUnit:'/ per villain',
    bName:'Office Boxing', bDesc:'Build yourself and your boss or coworker, then box it out in the office', bUnit:'/ per match',
    sName:'Smoke Break', sDesc:'A worn-out office worker\'s late-night smoke in the alley. Hold to inhale, release to exhale', sUnit:'/ per cigarette',
    foot:'Everything here is a virtual game. Do not use it to harm or harass real people. Virtual cigarettes, zero nicotine — real smoking harms your health.',
    back:'← Back', demo:'DEMO', demoTxt:'This is a demo of the checkout. The live version would connect to a real payment provider (Stripe / Touch \'n Go / FPX / PayMe...).',
    payOk:'Simulate payment', cancel:'Cancel', payV:'One villain session', payS:'One cigarette',
    puffs:' puffs', cigs:' cigs', hits:' hits',
    sLight:'Light one up?', sLightBtn:'🔥 Buy one & light it', sHint:'Hold = inhale · Release = exhale', sDone:'Finished', sAgain:'🚬 Another one', cough:'*cough cough*',
    vTalk:'Tell the master what you want…', vSend:'Say', vNameIn:'Villain\'s name / nickname', vGive:'Hand it over', vHint:'👆 Tap tap tap — the slipper slaps!', vAgain:'🩴 Another villain', vDoneT:'Villain banished ✨',
    vReadThis:'Read this out loud:', vMic:'🎤 Tap to start speaking', vMicStop:'⏹ Tap when done', vHeard:'Granny heard: ', vAcc:'accuracy', vMicDenied:'Microphone blocked — please allow it in your browser settings.', vNoSR:'This browser has no speech recognition — type to the master in Chinese:', mand:'Mandarin', cant:'Cantonese', vTries:'Tries left:', vSayName:'Say the name of who you want to hit', vNameEg:'(in Chinese, e.g. 衰老板 — bad boss)', vOverT:'Granny: "No understand. Closed!"', vOverD:'Granny couldn\'t understand a word you said and shooed you away.', vRetry:'🙏 Beg granny again', vFinish:'😮‍💨 I feel better, done', vLuckT:'\'s fortune', vBottom:'💀 Out of luck!', vChantT:'👄 Chant while you hit:', vChantOr:'or shout "{n}" or curse them out!', vChantBtn:'🎤 Chant / curse', vChantStop:'🔴 Listening… (tap to stop)', vNameCrit:'🎯 Said the name! CRITICAL!', vChantOK:'📿 Chant works! Combo!', vCurseIn:'Type a curse / chant…',
  }
};
let lang = 'zh', currency = 'MYR';
const PRICES = { MYR:'RM 0.50', HKD:'HK$ 1.00', USD:'US$ 0.10' };
const t = k => I18N[lang][k];
const $ = s => document.querySelector(s);
function applyI18n(){
  document.querySelectorAll('[data-i]').forEach(el => el.innerHTML = t(el.dataset.i));
  document.querySelectorAll('.card .p').forEach(el => el.textContent = PRICES[currency]);
  document.documentElement.lang = lang === 'zh' ? 'zh' : 'en';
}
function pickPill(sel, attr, val){ document.querySelectorAll(sel+' .pill').forEach(b => b.classList.toggle('sel', b.dataset[attr]===val)); }
$('#langSel').onclick = e => { const l = e.target.dataset.l; if(!l) return; lang = l; pickPill('#langSel','l',l); applyI18n(); };
$('#curSel').onclick = e => { const c = e.target.dataset.c; if(!c) return; currency = c; pickPill('#curSel','c',c); applyI18n(); };

/* ---------- 付款（演示） ---------- */
let payCb = null;
function pay(what, cb){ payCb = cb; $('#payWhat').textContent = what; $('#payAmt').textContent = PRICES[currency]; $('#payModal').classList.add('on'); }
$('#confirmPay').onclick = () => { $('#payModal').classList.remove('on'); sfx.coin(); const cb = payCb; payCb = null; cb && cb(true); };
$('#cancelPay').onclick = () => { $('#payModal').classList.remove('on'); const cb = payCb; payCb = null; cb && cb(false); };

/* =========================================================
   声音（全部用代码合成）
   ========================================================= */
let AC;
function ac(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC && AC.state==='suspended') AC.resume(); return AC; }
function noise(dur, {freq=1000, q=1, vol=.5, type='bandpass', curve=2}={}){
  const a = ac(); if(!a) return;
  const len = Math.max(1, Math.floor(a.sampleRate*dur)), buf = a.createBuffer(1,len,a.sampleRate), d = buf.getChannelData(0);
  for(let i=0;i<len;i++){ const k=i/len; d[i] = (Math.random()*2-1) * (curve<0 ? Math.sin(k*Math.PI) : Math.pow(1-k, curve)); }
  const src = a.createBufferSource(); src.buffer = buf;
  const f = a.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  const g = a.createGain(); g.gain.value = vol;
  src.connect(f).connect(g).connect(a.destination); src.start();
}
function tone(f1, f2, dur, vol=.3, type='sine'){
  const a = ac(); if(!a) return;
  const o = a.createOscillator(), g = a.createGain(); o.type = type;
  o.frequency.setValueAtTime(f1, a.currentTime); o.frequency.exponentialRampToValueAtTime(f2, a.currentTime+dur);
  g.gain.setValueAtTime(vol, a.currentTime); g.gain.exponentialRampToValueAtTime(.001, a.currentTime+dur);
  o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime+dur);
}
const sfx = {
  slap(){ noise(.13,{freq:1600,q:.6,vol:1}); tone(160,50,.12,.5); },
  crackle(){ noise(.025,{freq:4500+Math.random()*2500,q:3,vol:.22}); },
  exhale(d){ noise(d,{freq:900,q:.4,vol:.4,type:'lowpass',curve:-1}); },
  cough(){ noise(.18,{freq:500,q:.8,vol:.9}); setTimeout(()=>noise(.16,{freq:450,q:.8,vol:.8}),220); setTimeout(()=>noise(.2,{freq:420,q:.8,vol:.7}),430); },
  lighter(){ noise(.05,{freq:6000,q:2,vol:.5}); setTimeout(()=>noise(.6,{freq:800,q:.5,vol:.25,curve:-1}),80); },
  fire(){ noise(2.2,{freq:500,q:.4,vol:.35,curve:-1}); },
  no(){ tone(300,180,.25,.2,'square'); },
  coin(){ tone(988,988,.08,.2,'square'); setTimeout(()=>tone(1319,1319,.25,.2,'square'),80); },
};
const buzz = ms => { try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} };
function say(text){ // 有粤语语音就用粤语读出来
  try{
    if(!window.speechSynthesis) return;
    const u = new SpeechSynthesisUtterance(text.replace(/[～~！!？?，,。]/g,' '));
    const v = speechSynthesis.getVoices().find(v => /zh[-_]HK|yue/i.test(v.lang));
    if(v) u.voice = v; u.lang = 'zh-HK'; u.rate = 1.1; u.pitch = 1.25;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}

/* =========================================================
   3D 引擎公共部分
   ========================================================= */
const T = THREE;
const rand = (a,b) => a + Math.random()*(b-a);
const stage = $('#stage');
let renderer, scene, camera, game = null, raf = 0, shakeAmt = 0;
const clock = new T.Clock();

function makeTex(draw, w=128, h=w){ const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const tx = new T.CanvasTexture(c); tx.anisotropy = 4; return tx; }
const smokeTex = makeTex((g,s) => {
  for(let i=0;i<16;i++){
    const x = s/2+rand(-s*.17,s*.17), y = s/2+rand(-s*.17,s*.17), r = rand(s*.14,s*.3);
    const gr = g.createRadialGradient(x,y,0,x,y,r); gr.addColorStop(0,'rgba(255,255,255,.32)'); gr.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(0,0,s,s);
  }
});
const glowTex = makeTex((g,s) => { const gr = g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2); gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(.25,'rgba(255,200,120,.8)'); gr.addColorStop(1,'rgba(255,80,0,0)'); g.fillStyle = gr; g.fillRect(0,0,s,s); });

// 粒子（烟、火、灰尘）
function Puffs(tex, blending = T.NormalBlending){
  const list = [], pool = [];
  return {
    spawn(o){
      let s = pool.pop();
      if(!s) s = new T.Sprite(new T.SpriteMaterial({map:tex, transparent:true, depthWrite:false, blending, fog:true}));
      s.material.color.set(o.color ?? 0xffffff); s.material.rotation = Math.random()*6.28; s.material.opacity = 0;
      s.position.copy(o.pos); s.scale.set(o.s0, o.s0, 1); scene.add(s);
      list.push({s, v:o.vel.clone(), t:0, life:o.life, s0:o.s0, s1:o.s1, op:o.op, spin:o.spin ?? rand(-.6,.6), drag:o.drag ?? .98, up:o.up ?? 0, sway:o.sway ?? 0, ph:Math.random()*6});
    },
    update(dt){
      for(let i=list.length-1;i>=0;i--){
        const p = list[i]; p.t += dt; const k = p.t/p.life;
        if(k >= 1){ scene.remove(p.s); pool.push(p.s); list.splice(i,1); continue; }
        p.v.multiplyScalar(Math.pow(p.drag, dt*60)); p.v.y += p.up*dt;
        p.s.position.addScaledVector(p.v, dt);
        if(p.sway) p.s.position.x += Math.sin(p.t*2.2+p.ph)*p.sway*dt;
        const sc = p.s0 + (p.s1-p.s0)*(1-Math.pow(1-k,2)); p.s.scale.set(sc,sc,1);
        p.s.material.rotation += p.spin*dt;
        p.s.material.opacity = p.op * (k < .12 ? k/.12 : 1-(k-.12)/.88);
      }
    },
    clear(){ list.forEach(p => { scene.remove(p.s); pool.push(p.s); }); list.length = 0; },
    get count(){ return list.length; }
  };
}

function initRenderer(){
  if(renderer) return;
  renderer = new T.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = T.PCFSoftShadowMap;
  stage.prepend(renderer.domElement);
  const el = renderer.domElement;
  el.addEventListener('pointerdown', e => { ac(); el.setPointerCapture(e.pointerId); game && game.down && game.down(ndc(e), e); });
  el.addEventListener('pointerup', () => game && game.up && game.up());
  el.addEventListener('pointercancel', () => game && game.up && game.up());
  window.addEventListener('resize', resize);
}
function ndc(e){ const r = renderer.domElement.getBoundingClientRect(); return new T.Vector2((e.clientX-r.left)/r.width*2-1, -(e.clientY-r.top)/r.height*2+1); }
function resize(){
  if(!renderer || !game) return;
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w/h; camera.updateProjectionMatrix();

}
function toScreen(v){ const p = v.clone().project(camera); return {x:(p.x+1)/2*stage.clientWidth, y:(1-p.y)/2*stage.clientHeight}; }
function floatText(world, txt, color='#ffc94d', size=26){

  d.className = 'ft'; d.textContent = txt; d.style.cssText += `left:${s.x}px;top:${s.y}px;color:${color};font-size:${size}px`;

function loop(){
  raf = requestAnimationFrame(loop);
  const dt = Math.min(.05, clock.getDelta());
  game.update(dt);

  camera.lookAt(game.camLook);

}

function stretch(mesh, a, b){ // 让一根单位长度圆柱连接 a → b
  const d = b.clone().sub(a), len = d.length();

  mesh.scale.set(1, len, 1);
}

/* =========================================================
   游戏一：抽根烟（方块风 · 落魄打工仔 · POV）
   ========================================================= */
// 抽烟游戏专用声音：环境 + 打火机 + 吸 + 呼 + 咳 + 叹气 + 车经过（全部即时合成）
function SmokeAudio(){
  const a = ac();
  const nop = () => {};
  if(!a) return {stop:nop, lighter:nop, inhaleStart:nop, inhaleStop:nop, crackle:nop, exhale:nop, cough:nop, sigh:nop, carPass:nop, whoosh:nop, tick:nop, ash:nop};
  const master = a.createGain(); master.gain.value = 1; master.connect(a.destination);
  const now = () => a.currentTime;
  const white = (() => { const len = a.sampleRate*2, b = a.createBuffer(1,len,a.sampleRate), d = b.getChannelData(0); for(let i=0;i<len;i++) d[i] = Math.random()*2-1; return b; })();
  const brown = (() => { const len = a.sampleRate*3, b = a.createBuffer(1,len,a.sampleRate), d = b.getChannelData(0); let l = 0; for(let i=0;i<len;i++){ l = (l + .02*(Math.random()*2-1))/1.02; d[i] = l*3.5; } return b; })();
  const loops = [];
  function src(buf, loop){ const s = a.createBufferSource(); s.buffer = buf; s.loop = !!loop; if(loop) s.loopStart = Math.random(); return s; }
  function filt(type, f, q=1){ const x = a.createBiquadFilter(); x.type = type; x.frequency.value = f; x.Q.value = q; return x; }
  function gain(v){ const g = a.createGain(); g.gain.value = v; return g; }
  function pan(v){ if(a.createStereoPanner){ const p = a.createStereoPanner(); p.pan.value = v; return p; } return gain(1); }
  function chain(...n){ for(let i=0;i<n.length-1;i++) n[i].connect(n[i+1]); return n[n.length-1]; }
  // 一次性噪音（有包络）
  function burst(dur, {type='bandpass', f=1000, q=1, vol=.3, att=.005, f2=null, p=0, buf=white, at=0}={}){
    const t0 = now()+at, s = src(buf), fl = filt(type, f, q), g = gain(0), pn = pan(p);
    if(f2) fl.frequency.exponentialRampToValueAtTime(f2, t0+dur);
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0+att); g.gain.exponentialRampToValueAtTime(.0001, t0+dur);
    chain(s, fl, g, pn, master); s.start(t0, Math.random()); s.stop(t0+dur+.05);
  }
  function osc(type, f1, f2, dur, vol, {at=0, p=0, lp=0}={}){
    const t0 = now()+at, o = a.createOscillator(), g = gain(0), pn = pan(p); o.type = type;
    o.frequency.setValueAtTime(f1, t0); o.frequency.exponentialRampToValueAtTime(Math.max(1,f2), t0+dur);
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0+.01); g.gain.exponentialRampToValueAtTime(.0001, t0+dur);
    if(lp){ chain(o, filt('lowpass', lp, .7), g, pn, master); } else chain(o, g, pn, master);
    o.start(t0); o.stop(t0+dur+.05);
  }

  // ---- 环境声（循环）----
  // 雨：沙沙声 + 打落地面嘅低频
  { const s = src(white, true); chain(s, filt('bandpass', 2600, .35), gain(.055), master); s.start(); loops.push(s);
    const s2 = src(brown, true); chain(s2, filt('lowpass', 700, .5), gain(.06), master); s2.start(); loops.push(s2); }
  // 城市远处车流（低沉、慢慢起伏）
  { const s = src(brown, true), g = gain(.1), lfo = a.createOscillator(), lg = gain(.05);
    lfo.frequency.value = .07; lfo.connect(lg); lg.connect(g.gain);
    chain(s, filt('lowpass', 260, .6), g, master); s.start(); lfo.start(); loops.push(s, lfo); }
  // 冷气机嗡嗡声
  { const o = a.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 58;
    const o2 = a.createOscillator(); o2.type = 'sine'; o2.frequency.value = 117;
    const g = gain(.012); chain(o, filt('lowpass', 180, .8), g, pan(.4), master); o2.connect(gain(.008)).connect(master);
    const fanN = src(white, true); chain(fanN, filt('bandpass', 420, 2), gain(.012), pan(.4), master);
    o.start(); o2.start(); fanN.start(); loops.push(o, o2, fanN); }

  // ---- 随机环境事件 ----
  const ev = { horn: rand(5,12), siren: rand(18,35), drip: .5, thunder: rand(25,50), dog: rand(30,60) };
  function horn(){ const p = rand(-.8,.8), d = rand(.18,.45); osc('square', 410, 405, d, .02, {p, lp:1400}); osc('square', 520, 515, d, .015, {p, lp:1400});
    if(Math.random() < .4){ osc('square', 410, 405, d*.7, .02, {p, lp:1400, at:d+.12}); osc('square', 520, 515, d*.7, .015, {p, lp:1400, at:d+.12}); } }
  function siren(){ const t0 = now(), o = a.createOscillator(), g = gain(0), p = pan(rand(-.6,.6)); o.type = 'triangle';
    for(let i=0;i<6;i++){ o.frequency.setValueAtTime(650, t0+i*.9); o.frequency.linearRampToValueAtTime(980, t0+i*.9+.45); o.frequency.linearRampToValueAtTime(650, t0+i*.9+.9); }
    g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(.018, t0+1.5); g.gain.linearRampToValueAtTime(.018, t0+3.5); g.gain.linearRampToValueAtTime(0, t0+5.4);
    chain(o, filt('lowpass', 1500, .7), g, p, master); o.start(t0); o.stop(t0+5.5); }
  function drip(){ const f = rand(1400,3200); osc('sine', f, f*.55, rand(.04,.09), rand(.015,.04), {p:rand(-.9,.9)}); }
  function thunder(){ burst(rand(2.5,4), {type:'lowpass', f:160, q:.5, vol:.35, att:rand(.3,.8), buf:brown, p:rand(-.5,.5)}); }
  function dog(){ const p = rand(-.9,.9); for(let i=0;i<2+(Math.random()*2|0);i++){ osc('sawtooth', 520, 300, .12, .012, {p, lp:1200, at:i*.28}); burst(.1, {f:900, q:2, vol:.01, p, at:i*.28}); } }
  function tick(dt){
    for(const k in ev){ ev[k] -= dt; }
    if(ev.horn <= 0){ horn(); ev.horn = rand(7,18); }
    if(ev.siren <= 0){ siren(); ev.siren = rand(30,55); }
    if(ev.drip <= 0){ drip(); ev.drip = rand(.2,1.1); }
    if(ev.thunder <= 0){ thunder(); ev.thunder = rand(35,70); }
    if(ev.dog <= 0){ dog(); ev.dog = rand(40,80); }
  }

  // ---- 车经过（由远到近再远，左右移动，有多普勒）----
  function carPass(dir, dur){
    const t0 = now(), mid = t0 + dur/2, end = t0 + dur;
    const p = pan(0); if(p.pan){ p.pan.setValueAtTime(-dir, t0); p.pan.linearRampToValueAtTime(dir, end); }
    const g = gain(0); g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(.05, mid-.6); g.gain.linearRampToValueAtTime(.22, mid); g.gain.linearRampToValueAtTime(.05, mid+.6); g.gain.linearRampToValueAtTime(0, end);
    chain(g, p, master);
    const eng = a.createOscillator(); eng.type = 'sawtooth';
    eng.frequency.setValueAtTime(78, t0); eng.frequency.linearRampToValueAtTime(84, mid-.1); eng.frequency.linearRampToValueAtTime(64, mid+.3); eng.frequency.linearRampToValueAtTime(60, end);
    chain(eng, filt('lowpass', 320, .8), gain(.35), g); eng.start(t0); eng.stop(end+.1);
    const tire = src(white, true), tf = filt('bandpass', 1400, .5);   // 湿地轮胎声
    tf.frequency.setValueAtTime(1800, t0); tf.frequency.linearRampToValueAtTime(1200, end);
    chain(tire, tf, gain(.8), g); tire.start(t0); tire.stop(end+.1);
  }

  // ---- 打火机：转火石 → 火花 → 呼一声着火 → 火焰嘶嘶 → 放手 ----
  function lighter(){
    for(let i=0;i<3;i++) burst(.025, {type:'highpass', f:3500, q:.7, vol:.35, at:i*.045});
    burst(.04, {type:'bandpass', f:6000, q:1.5, vol:.4, at:.14});
    burst(.35, {type:'lowpass', f:500, q:.8, vol:.4, att:.04, f2:1600, at:.16});
    burst(1.1, {type:'bandpass', f:1700, q:.6, vol:.12, att:.08, at:.2});
    osc('square', 2300, 1800, .02, .04, {at:1.3});
  }

  // ---- 吸：气流声（持续）+ 烟纸燃烧噼啪 ----
  let inh = null;
  function inhaleStart(){
    if(inh) return;
    const t0 = now(), s = src(white, true), f = filt('bandpass', 1300, .9), g = gain(0);
    f.frequency.setValueAtTime(1300, t0); f.frequency.linearRampToValueAtTime(2100, t0+2.5);
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(.09, t0+.25);
    chain(s, f, g, master); s.start(t0);
    const sz = src(white, true), szf = filt('highpass', 6500, .5), szg = gain(0);   // 烟纸烧紧嘅嘶嘶
    szg.gain.setValueAtTime(0, t0); szg.gain.linearRampToValueAtTime(.035, t0+.2);
    chain(sz, szf, szg, master); sz.start(t0);
    inh = {s, g, sz, szg};
  }
  function inhaleStop(){
    if(!inh) return;
    const t0 = now(), x = inh; inh = null;
    x.g.gain.cancelScheduledValues(t0); x.g.gain.setValueAtTime(x.g.gain.value, t0); x.g.gain.linearRampToValueAtTime(0, t0+.12);
    x.szg.gain.cancelScheduledValues(t0); x.szg.gain.setValueAtTime(x.szg.gain.value, t0); x.szg.gain.linearRampToValueAtTime(0, t0+.1);
    x.s.stop(t0+.15); x.sz.stop(t0+.15);
  }
  function crackle(){ burst(.02, {type:'bandpass', f:rand(3500,7000), q:3, vol:rand(.12,.28)}); }

  // ---- 呼：嘴唇「噗」一声 + 「呼～」气声（大口大声，细口细声）----
  function exhale(k){
    const dur = .8 + k*1.6, vol = .1 + k*.28;
    osc('sine', 140, 60, .05, .12*(.5+k)); burst(.03, {type:'lowpass', f:900, vol:.1*(.5+k)});
    const t0 = now()+.04, s = src(white), f = filt('bandpass', 1300, .55), lp = filt('lowpass', 2600, .5), g = gain(0);
    f.frequency.setValueAtTime(1400, t0); f.frequency.exponentialRampToValueAtTime(650, t0+dur);
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0+.09); g.gain.linearRampToValueAtTime(vol*.7, t0+dur*.5); g.gain.exponentialRampToValueAtTime(.0001, t0+dur);
    chain(s, f, lp, g, master); s.start(t0, Math.random()); s.stop(t0+dur+.05);
  }
  // ---- 咳 ----
  function cough(){
    for(let i=0;i<4;i++){ const at = i*.24 + (i>1?.15:0);
      burst(.16, {type:'bandpass', f:rand(450,650), q:.9, vol:.55, att:.008, f2:300, at});
      osc('sawtooth', 170, 110, .12, .06, {at, lp:700}); }
  }
  // ---- 叹气 ----
  function sigh(){
    burst(1.3, {type:'bandpass', f:1000, q:.6, vol:.14, att:.25, f2:450});
    osc('sawtooth', 115, 85, 1.0, .025, {lp:420, at:.1});
  }
  // ---- 镜头飞入 ----
  function whoosh(){ burst(.9, {type:'bandpass', f:250, q:.8, vol:.12, att:.4, f2:1800}); }
  function ash(){ osc('sine', 2600, 2000, .015, .02); }

  function stop(){
    const t0 = now(); master.gain.setValueAtTime(master.gain.value, t0); master.gain.linearRampToValueAtTime(0, t0+.3);
    inhaleStop(); setTimeout(() => { loops.forEach(s => { try{ s.stop(); }catch(e){} }); try{ master.disconnect(); }catch(e){} }, 400);
  }
  return {stop, lighter, inhaleStart, inhaleStop, crackle, exhale, cough, sigh, carPass, whoosh, tick, ash};
}

    }
    const lit = state === 'pov' || state === 'flying';
    const target = lit ? (holding && handPose.p.distanceTo(INHALE.p) < .08 ? 3.2 : .9 + Math.sin(now/200)*.15) : (state === 'lighting' ? emberI : 0);

    // 烟头细烟

    }
    if(exhaleLeft > 0){ let n = exhaleRate*dt; while(n > 0 && exhaleLeft > 0){ if(n >= 1 || Math.random() < n){ emitExhale(); exhaleLeft--; } n--; } }

    // 讲嘢泡泡
    if(bubbleOn){
      if(man.visible){ headG.getWorldPosition(headW); headW.y += .4; const s = toScreen(headW); const b = $('#bubble');

      if(now > talkUntil){ $('#bubble').style.display = 'none'; bubbleOn = false; }
    }
    // 雨
    for(const r of rain){ r.position.y -= 9*dt; r.position.x -= 1*dt; if(r.position.y < 0){ r.position.y = rand(5,7); r.position.x = rand(-7,7); r.position.z = rand(-1,10); } }
    // 车
    carT -= dt;
    if(!car && carT <= 0) spawnCar();
    if(car){ car.g.position.x += car.dir*9*dt; if(Math.abs(car.g.position.x) > 17){ scene.remove(car.g); car = null; carT = rand(5,11); } }
    lampLight.intensity = 1.5 + (Math.random() < .01 ? -1 : 0);
    if(state !== 'pov') au.inhaleStop();
    au.tick(dt);
    updSmoke(dt); cubes.update(dt);
  };
  G.stop = () => { au.stop(); cubes.clear(); smokeList.forEach(p => scene.remove(p.m)); smokeList.length = 0; scene.remove(camera); };
  return G;
}

function pixTex(w, h, draw, rep){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); g.imageSmoothingEnabled = false; draw(g, w, h);
  const tx = new T.CanvasTexture(c); tx.magFilter = T.NearestFilter; tx.minFilter = T.NearestFilter; tx.generateMipmaps = false;
  if(rep){ tx.wrapS = tx.wrapT = T.RepeatWrapping; tx.repeat.set(rep[0], rep[1]); }
  return tx;
}
function jit(hex, a){ const c = new T.Color(hex), k = 1 + rand(-a, a); return `rgb(${Math.min(255,c.r*255*k)|0},${Math.min(255,c.g*255*k)|0},${Math.min(255,c.b*255*k)|0})`; }
function noiseFill(g, x0, y0, w, h, hex, a){ for(let y=y0;y<y0+h;y++) for(let x=x0;x<x0+w;x++){ g.fillStyle = jit(hex, a); g.fillRect(x,y,1,1); } }
const lam = (o) => new T.MeshLambertMaterial(typeof o === 'number' ? {color:o} : o);
function vbox(w, h, d, mat){ const m = new T.Mesh(new T.BoxGeometry(w, h, d), mat); m.castShadow = true; m.receiveShadow = true; return m; }

// 方块粒子
function Cubes(){
  const list = [], geo = new T.BoxGeometry(1,1,1), cache = {};
  const mat = (c, glow) => cache[c+'_'+glow] || (cache[c+'_'+glow] = glow ? new T.MeshBasicMaterial({color:c}) : new T.MeshLambertMaterial({color:c}));
  return {
    spawn(o){
      const m = new T.Mesh(geo, mat(o.color, !!o.glow)); m.position.copy(o.pos); m.scale.setScalar(o.size);
      m.rotation.set(rand(0,3), rand(0,3), 0); scene.add(m);
      list.push({m, v:o.vel.clone(), g:o.g ?? -7, life:o.life, t:0, s:o.size, floor:o.floor ?? -1});
    },
    update(dt){
      for(let i=list.length-1;i>=0;i--){
        const p = list[i]; p.t += dt; const k = p.t/p.life;
        if(k >= 1){ scene.remove(p.m); list.splice(i,1); continue; }
        p.v.y += p.g*dt; p.m.position.addScaledVector(p.v, dt);
        if(p.m.position.y < p.floor + p.s/2){ p.m.position.y = p.floor + p.s/2; p.v.x *= .5; p.v.z *= .5; p.v.y *= -.25; }
        p.m.scale.setScalar(p.s * (1 - k*k));
      }
    },
    clear(){ list.forEach(p => scene.remove(p.m)); list.length = 0; }
  };
}

// 语音识别
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function lev(a, b){
  const m = a.length, n = b.length, d = Array.from({length:m+1}, (_, i) => [i, ...Array(n).fill(0)]);
  for(let j=1;j<=n;j++) d[0][j] = j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++) d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1] + (a[i-1]===b[j-1]?0:1));
  return d[m][n];
}
const normZh = s => (s||'').replace(/[父]/g,'傅').replace(/[^㐀-鿿A-Za-z0-9]/g,'').toLowerCase();
function similarity(heard, targets){
  const h = [...normZh(heard)];
  return Math.max(...targets.map(tg => { const tt = [...normZh(tg)]; return 1 - lev(h, tt)/Math.max(h.length, tt.length, 1); }));
}

  function setBlock(on){ if(mode !== 'fight' || ended) return; if(on){ if(me.act === 'idle'){ me.act = 'block'; me.at = 0; me.dur = 99; } } else if(me.act === 'block'){ me.act = 'idle'; } }
  const isDodging = f => (f.act === 'dodgeL' || f.act === 'dodgeR') && f.at < f.dur*.85;
  const OFFICE_HIT = [['威严 -10','Authority -10'],['面子 -20','Face -20'],['发量 -3','Hair -3'],['年终奖 -1000','Bonus -1000'],['气焰 -15','Ego -15']];
  const OFFICE_HURT = [['加班 +1h','Overtime +1h'],['工资 -100','Salary -100'],['精神 -10','Sanity -10'],['周末 -1','Weekend -1']];
  function resolve(att, def, kind){
    const isMe = att === me;
    const headW = new T.Vector3(); def.headG.getWorldPosition(headW);
    if(isDodging(def)){ floatText(headW.clone().add(new T.Vector3(0,.35,0)), def.act === 'dodgeL' ? L('闪身步！','Side Step!') : L('狗熊抖抖毛！','Bear Shake!'), '#7be0ff', 26); bxSfx.whoosh(); if(isMe) stats.combo = 0; return; }
    if(def.act === 'block'){
      const dmg = kind === 'kick' ? 5 : kind === 'cross' ? 3 : 1; def.hp -= dmg; bxSfx.block();
      floatText(headW.clone().add(new T.Vector3(0,.35,0)), L('格挡','Blocked'), '#cfd8ff', 22);
      for(let i=0;i<6;i++) cubes.spawn({pos:headW.clone().add(new T.Vector3(0,-.2,isMe?.3:-.3)), vel:new T.Vector3(rand(-1.5,1.5),rand(.5,2),rand(-1,1)), g:-6, life:.4, size:.04, color:0xffffff, glow:true, floor:0});
      if(isMe) stats.combo = 0; updHud(); checkKO(); return;
    }
    let dmg = kind === 'kick' ? 16 + (Math.random()*6|0) : kind === 'cross' ? 11 + (Math.random()*5|0) : 6 + (Math.random()*4|0);
    if(kind === 'kick') floatText(headW.clone().add(new T.Vector3(0,.75,0)), isMe ? L('⚽ 浪子踢球！','⚽ Prodigal Kick!') : L('飞踢！','Flying kick!'), '#ff9d3b', 30);
    let crit = false;
    if(isMe){ stats.land++; stats.combo++; comboT = 1.1; stats.best = Math.max(stats.best, stats.combo); if(stats.combo >= 5 || Math.random() < .08){ crit = true; dmg = Math.round(dmg*1.6); } }
    else dmg = Math.round(dmg * (.8 + ai.aggr*.15));
    if(def === opp){ opp.gloveM.emissive.set(0x000000); $('#warnMark').style.display = 'none'; }
    def.hp -= dmg; def.act = 'hit'; def.at = 0; def.dur = DUR.hit; def.setFace('hurt');
    bxSfx.hit(kind !== 'jab' || crit ? 1 : 0); if(kind === 'kick') bxSfx.thud(); buzz(isMe ? 25 : 60); shakeAmt = isMe ? .04 + (crit?.04:0) : .09;
    floatText(headW.clone().add(new T.Vector3(rand(-.15,.15),.3,0)), (crit ? '💥' : '') + '-' + dmg, crit ? '#ff3b3b' : (isMe ? '#ffc94d' : '#ff6b6b'), crit ? 34 : 26);
    if(isMe && stats.combo >= 3) floatText(headW.clone().add(new T.Vector3(.5,.6,0)), `${stats.combo} ${L('连击！','COMBO!')}`, '#ff9d3b', 24);
    if(isMe && Math.random() < .3){ const o = OFFICE_HIT[(Math.random()*OFFICE_HIT.length)|0]; floatText(headW.clone().add(new T.Vector3(-.45,.1,0)), L(o[0],o[1]), '#c58bff', 18); }
    if(!isMe && Math.random() < .5){ const o = OFFICE_HURT[(Math.random()*OFFICE_HURT.length)|0]; floatText(new T.Vector3(-.5,1.5,1.4), L(o[0],o[1]), '#ff8b8b', 18); }
    if(!isMe){ const fl = $('#hurtFlash'); if(fl){ fl.style.opacity = '.55'; setTimeout(() => fl.style.opacity = '0', 120); } }
    if(isMe && Math.random() < .25) oppSay(OUCH);
    for(let i=0;i<10;i++) cubes.spawn({pos:headW.clone(), vel:new T.Vector3(rand(-1.5,1.5),rand(.8,2.5),rand(-1,1)*(isMe?-1:1)), g:-7, life:rand(.4,.8), size:rand(.03,.06), color:[0x9fd8ff,0xffffff,0xffe066][i%3], floor:0});
    if(crit || kind !== 'jab') crowd.forEach(c => c.cheer = 1);
    if(crit) bxSfx.ooh();
    updHud(); checkKO();
  }
  function checkKO(){
    if(ended) return;
    const loser = opp.hp <= 0 ? opp : me.hp <= 0 ? me : null;
    if(!loser) return;
    endFight(loser === opp ? 'win' : 'lose', true);
  }
  function endFight(res, ko){
    ended = true; const loser = res === 'win' ? opp : me, winner = res === 'win' ? me : opp;
    if(ko){ loser.act = 'ko'; loser.at = 0; loser.setFace('ko'); timeScale = .3; setTimeout(() => timeScale = 1, 900); bxSfx.thud(); setTimeout(() => bxSfx.ding(), 300); setTimeout(() => bxSfx.ding(), 700); setTimeout(() => bxSfx.ding(), 1100); bxSfx.cheer(); }
    winner.act = 'win'; winner.at = 0; winner.setFace('happy'); if(!ko) loser.setFace('hurt');
    crowd.forEach(c => c.cheer = 3);
    $('#warnMark').style.display = 'none'; opp.gloveM.emissive.set(0x000000); hint(''); tools('');
    floatText(new T.Vector3(0,2,0), ko ? 'K.O.!' : L('时间到！','TIME!'), '#ff3b3b', 64);
    if(res === 'win'){ const b = $('#bubble'); b.innerHTML = L('我……我批你放长假……','I… I approve your long vacation…') + (lang==='en'?'':''); b.style.display = 'block'; bubbleOn = true; talkUntil = performance.now() + 2000; }
    setTimeout(() => {
      const acc = stats.punch ? Math.round(stats.land/stats.punch*100) : 0;
      center(`<div style="font-size:56px">${res === 'win' ? '🏆' : '😵'}</div><h2>${res === 'win' ? L('你赢了！','You win!') : L('你输了……','You lost…')}</h2>
        <div class="lbl" style="max-width:300px">${res === 'win' ? L(`「${save.opp.name}」被你打到${ko?' K.O.':'认输'}！`,`"${save.opp.name}" got ${ko?'knocked out':'beaten'}!`) : L(`你被「${save.opp.name}」${ko?' K.O. 了':'打赢了'}……`,`"${save.opp.name}" ${ko?'knocked you out':'won'}…`)}</div>
        <div style="color:#ffc94d;font-size:14px">${L('出拳','Punches')} ${stats.punch} · ${L('命中','Landed')} ${stats.land} (${acc}%) · ${L('最高连击','Best combo')} ${stats.best}</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><button class="btn gold" id="bxagain">🥊 ${L('再打一场','Rematch')} ${PRICES[currency]}</button><button class="btn ghost" id="bxedit">✏️ ${L('改角色','Edit fighters')}</button></div>`);
      $('#bxagain').onclick = () => pay(L('办公室拳击一场','One office boxing match'), ok => { if(ok){ center(''); rebuild(); startFight(); } });
      $('#bxedit').onclick = () => { center(''); rebuild(); createUI(); };
    }, 2200);
  }

  // ---- 姿势 ----
  const bell = k => Math.sin(Math.min(1,Math.max(0,k))*Math.PI);
  function pose(f, dt, t){
    const k = f.dur ? f.at/f.dur : 0;
    let rL = {x:-1.72, z:.38, pz:.04}, rR = {x:-1.72, z:.38, pz:.04}, yaw = 0, lean = .08, side = 0, drop = 0, headX = .05, roll = 0, legK = 0, bob = Math.sin(t*5 + (f===me?0:1.5))*.02;
    if(mode === 'create'){ rL = {x:-.15, z:.12, pz:0}; rR = {x:-.15, z:.12, pz:0}; lean = 0; bob = Math.sin(t*2)*.01; headX = 0; }
    switch(f.act){
      case 'jab': { const e = k < .4 ? k/.4 : 1-(k-.4)/.6; rL = {x:-1.72+.2*e, z:.38-.34*e, pz:.04+.3*e}; yaw = .18*e; break; }
      case 'cross': { const e = k < .45 ? Math.pow(k/.45,1.5) : 1-(k-.45)/.55; rR = {x:-1.72+.2*e, z:.38-.34*e, pz:.04+.36*e}; yaw = -.38*e; lean = .08+.12*e; break; }
      case 'windup': { const e = Math.min(1,k*1.25), ee = e*e*(3-2*e);
        if(ai.kind === 'cross'){ rR = {x:-1.3, z:.05, pz:-.34*ee}; yaw = .6*ee; lean = .08-.18*ee; drop = .06*ee; }
        else if(ai.kind === 'kick'){ legK = .45*ee; lean = .08-.22*ee; drop = .05*ee; rL = {x:-1.5, z:.5, pz:0}; rR = {x:-1.5, z:.5, pz:0}; }
        else { rL = {x:-1.45, z:.12, pz:-.26*ee}; yaw = -.38*ee; lean = .08-.1*ee; drop = .03*ee; }
        headX = .22; break; }
      case 'kick': { const e = k < .5 ? 1-Math.pow(1-k/.5,2) : 1-(k-.5)/.5; legK = -1.55*e; lean = .08-.32*e; yaw = .12*e; rL = {x:-1.9, z:.55, pz:0}; rR = {x:-1.6, z:.2, pz:0}; break; }
      case 'block': rL = {x:-2.6, z:.75, pz:.05}; rR = {x:-2.6, z:.75, pz:.05}; headX = .25; lean = .15; break;
      case 'hit': { const e = 1-k; lean = -.28*e; headX = -.4*e; rL.x += .4*e; rR.x += .4*e; break; }
      case 'dodgeL': case 'dodgeR': { const e = bell(k), s = f.act === 'dodgeL' ? 1 : -1; side = s*.55*e; drop = .12*e; roll = f.act === 'dodgeL' ? s*.28*e : Math.sin(f.at*48)*.24*e; if(f.act === 'dodgeR'){ rL.x += Math.sin(f.at*48)*.4*e; rR.x -= Math.sin(f.at*48)*.4*e; } break; }
      case 'win': { rL = {x:-3.0, z:.3, pz:0}; rR = {x:-3.0, z:.3, pz:0}; lean = -.05; bob = Math.abs(Math.sin(t*6))*.12; headX = -.15; break; }
    }
    // 角色本地 x：玩家转咗身，所以闪避方向要反转
    const sx = 1; if(f === me) yaw = -yaw;
    if(f.act === 'ko'){
      const e = Math.min(1, f.at/.7), ee = 1-Math.pow(1-e,3);
      f.rig.rotation.x = -Math.PI/2*ee; f.rig.position.y = .12*ee; f.rig.position.z = -.3*ee;
      [f.armL, f.armR].forEach(a => { a.p.rotation.x += (-.3 - a.p.rotation.x)*Math.min(1,dt*6); });
      if(e >= 1 && Math.random() < .5){ const hw = new T.Vector3(); f.headG.getWorldPosition(hw); const ang = t*5; cubes.spawn({pos:hw.add(new T.Vector3(Math.cos(ang)*.3,.25,Math.sin(ang)*.3)), vel:new T.Vector3(0,.2,0), g:0, life:.35, size:.05, color:0xffe066, glow:true}); }
      return;
    }
    const sp = Math.min(1, dt*22);
    const ap = (a, r) => { a.p.rotation.x += (r.x - a.p.rotation.x)*sp; a.p.rotation.z += (-a.side*r.z - a.p.rotation.z)*sp; a.p.position.z += (a.base.z + r.pz - a.p.position.z)*sp; };
    ap(f.armL, rL); ap(f.armR, rR);
    f.rig.rotation.y += (yaw - f.rig.rotation.y)*sp;
    f.rig.rotation.x += (lean - f.rig.rotation.x)*sp;
    f.rig.position.x += (side*sx - f.rig.position.x)*sp;
    f.rig.position.y = bob - drop;
    f.rig.rotation.z = (f === me ? -roll : roll);
    f.legs[0].rotation.x += (legK - f.legs[0].rotation.x)*sp; f.legs[1].rotation.x += (0 - f.legs[1].rotation.x)*sp;
    f.headG.rotation.x += (headX - f.headG.rotation.x)*sp;
  }

  function step(f, dt){
    if(f.act === 'idle' || f.act === 'ko' || f.act === 'win') { f.at += dt; return; }
    f.at += dt;
    const other = f === me ? opp : me;
    if((f.act === 'jab' || f.act === 'cross' || f.act === 'kick') && !f.hitDone && f.at >= f.dur*({jab:.4, cross:.45, kick:.5}[f.act])){ f.hitDone = true; if(!ended) resolve(f, other, f.act); }
    if(f.at >= f.dur){
      if(f.act === 'windup'){ f.act = ai.kind; f.at = 0; f.dur = DUR[ai.kind]; f.hitDone = false; bxSfx.whoosh(); f.gloveM.emissive.set(0x000000); $('#warnMark').style.display = 'none'; return; }
      if(f.act === 'hit'){ f.setFace(f.hp < 35 ? 'hurt' : (f === opp ? 'angry' : 'normal')); }
      if(f.act !== 'block' || f !== me) f.act = 'idle';
    }
  }
  function aiThink(dt){
    if(ended || startT > 0) return;
    ai.aggr = 1 + (140 - opp.hp)/80;
    if(opp.act !== 'idle') return;
    ai.timer -= dt;
    if(ai.timer <= 0){
      const rk = Math.random(); ai.kind = rk < .5 ? 'jab' : rk < .85 ? 'cross' : 'kick';
      opp.act = 'windup'; opp.at = 0; opp.dur = Math.max(.32, .62 - ai.aggr*.08); opp.setFace('angry');
      $('#warnMark').style.display = 'block'; if(ai.kind === 'kick') opp.dur += .1;
      ai.timer = rand(.6, 1.6) / ai.aggr;
      if(Math.random() < .15) oppSay(TAUNT);
    }
  }

  // ---- 输入 ----
  G.down = p => { if(mode !== 'fight') return; playerAct(p.x < 0 ? 'jab' : 'cross'); };
  const kd = e => { if(mode !== 'fight' || e.repeat) return; const k = e.key.toLowerCase();
    if(k === 'j' || k === 'arrowup') playerAct('jab'); else if(k === 'k') playerAct('cross'); else if(k === 's' || k === 'u') playerAct('kick'); else if(k === 'a' || k === 'arrowleft') playerAct('dodgeL'); else if(k === 'd' || k === 'arrowright') playerAct('dodgeR'); else if(k === ' ' || k === 'l' || k === 'arrowdown'){ e.preventDefault(); setBlock(true); } };
  const ku = e => { const k = e.key.toLowerCase(); if(k === ' ' || k === 'l' || k === 'arrowdown') setBlock(false); };
  window.addEventListener('keydown', kd); window.addEventListener('keyup', ku);

  const cubes = Cubes();
  let keyT = 1, phoneT = 12;
  G.update = rdt => {
    const dt = rdt*timeScale, t = performance.now()/1000;
    if(mode === 'create'){
      const ed = editing === 'me' ? me : opp, other = editing === 'me' ? opp : me;
      ed.root.rotation.y += rdt*.6; other.root.rotation.y += ((other === me ? .25 : -.25) - other.root.rotation.y)*Math.min(1,rdt*4);
      ed.root.position.z += (.75 - ed.root.position.z)*Math.min(1,rdt*5); other.root.position.z += (.2 - other.root.position.z)*Math.min(1,rdt*5);
    }
    if(mode === 'fight'){
      if(startT > 0) startT -= rdt;
      if(!ended && startT <= 0){ fightT -= dt; if(fightT <= 0){ fightT = 0; endFight(me.hp >= opp.hp ? 'win' : 'lose', false); } }
      comboT -= dt; if(comboT <= 0) stats.combo = 0;
      aiThink(dt); step(me, dt); step(opp, dt); updHud();
      // 镜头跟住自己（闪避时跟少少）
      G.camPos.x = baseCam.x + me.rig.position.x*-.5; G.camPos.y = baseCam.y; G.camPos.z = baseCam.z;
      // 警告标志
      const wn = $('#warnMark'); if(wn && wn.style.display === 'block'){ const hw = new T.Vector3(); opp.headG.getWorldPosition(hw); hw.y += .45; const s = toScreen(hw); wn.style.left = s.x + 'px'; wn.style.top = s.y + 'px'; }
    }
    if(me && opp){ pose(me, dt, t); pose(opp, dt, t); }
    crowd.forEach(c => { c.cheer = Math.max(0, c.cheer - rdt); const j = c.cheer > 0 ? Math.abs(Math.sin(t*9 + c.ph))*.15 : Math.sin(t*2 + c.ph)*.01; c.f.rig.position.y = j;
      const up = c.cheer > 0 ? -2.9 : -.1; c.f.armL.p.rotation.x += (up - c.f.armL.p.rotation.x)*Math.min(1,rdt*8); c.f.armR.p.rotation.x += (up - c.f.armR.p.rotation.x)*Math.min(1,rdt*8); });
    if(bubbleOn && opp){ const hw = new T.Vector3(); opp.headG.getWorldPosition(hw); hw.y += .5; const s = toScreen(hw); const b = $('#bubble');
      b.style.left = Math.max(110, Math.min(stage.clientWidth-110, s.x)) + 'px'; b.style.top = Math.max(b.offsetHeight+(mode==='fight'?64:6), s.y) + 'px';
      if(performance.now() > talkUntil){ b.style.display = 'none'; bubbleOn = false; } }
    keyT -= rdt; if(keyT <= 0){ bxSfx.key(); keyT = Math.random() < .3 ? rand(.6,2) : rand(.06,.16); }
    phoneT -= rdt; if(phoneT <= 0){ bxSfx.phone(); phoneT = rand(15,30); }
    cubes.update(dt);
  };
  G.stop = () => { cubes.clear(); window.removeEventListener('keydown', kd); window.removeEventListener('keyup', ku);
    ['#fhud','#hurtFlash','#warnMark'].forEach(s => { const e = $(s); if(e) e.remove(); });
    const tb = $('#tools'); tb.style.maxHeight = ''; tb.style.overflowY = ''; tb.style.alignItems = ''; tb.style.gap = ''; tb.style.padding = ''; };
  G.camPos.copy(new T.Vector3(0,1.35,4));
  rebuild(); createUI();
  return G;
}

applyI18n();
</script>
</body>
